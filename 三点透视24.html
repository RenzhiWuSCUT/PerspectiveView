<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>三点透视</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #fff;
      font-family: Arial, "Microsoft YaHei", sans-serif;
    }

    .wrap {
      width: 100vw;
      height: 100vh;
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: #fff;
    }

    .panel {
      --panel-bottom-height: clamp(164px, 24vh, 204px);
      position: relative;
      width: 100%;
      height: 100%;
      box-sizing: border-box;
      min-width: 0;
      min-height: 0;
      display: grid;
      grid-template-rows: 34px minmax(0, 1fr) var(--panel-bottom-height);
      border: 1px solid #d7dde3;
      background: #fff;
      overflow: hidden;
    }

    .panel-title {
      position: static;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #20262d;
      font-size: 15px;
      font-weight: 600;
      text-align: center;
      pointer-events: none;
      user-select: none;
    }

    #front2d {
      display: block;
      width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;
      background: #fff;
    }

    #space3d {
      display: block;
      width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;
      background: #fff;
      touch-action: none;
    }

    .space3d-wrap {
      position: relative;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
    }

    .space-label-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .space-label {
      position: absolute;
      transform: translate(-50%, -120%);
      color: #20262d;
      font: 600 12px Arial, "Microsoft YaHei", sans-serif;
      text-shadow: 0 1px 3px #fff, 0 -1px 3px #fff, 1px 0 3px #fff, -1px 0 3px #fff;
      user-select: none;
      white-space: nowrap;
    }

    .space-face-label {
      transform: translate(-50%, -50%);
      padding: 2px 6px;
      border: 1px solid currentColor;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.78);
      font-size: 12px;
    }

    .space-angle-label {
      transform: translate(-50%, -50%);
      font-size: 12px;
    }

    .space-select-info {
      z-index: 3;
      min-width: 96px;
      max-width: 320px;
      min-height: 18px;
      box-sizing: border-box;
      border: 1px solid #cfd6dd;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.9);
      color: #20262d;
      font: 12px Arial, "Microsoft YaHei", sans-serif;
      line-height: 1.45;
      padding: 8px 10px;
      pointer-events: none;
    }

    .space-select-info:empty::before {
      content: "点击三维点、线或画面查看注释";
      color: #77818b;
    }

    .space-select-info strong {
      font-size: 13px;
    }

    .space-message {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      color: #5f6973;
      font: 13px Arial, "Microsoft YaHei", sans-serif;
      pointer-events: none;
      user-select: none;
    }

    .space-controls {
      --space-button-width: 98px;
      --space-row-gap: 1px;
      z-index: 3;
      display: grid;
      grid-template-rows: repeat(3, minmax(32px, 1fr)) minmax(42px, 1.15fr);
      align-items: stretch;
      gap: 3px;
      width: 100%;
      min-width: 0;
      height: 100%;
      overflow-x: hidden;
      overflow-y: auto;
      pointer-events: auto;
    }

    .space-control-row {
      display: flex;
      justify-content: flex-end;
      gap: var(--space-row-gap);
      width: 100%;
      min-height: 0;
    }

    .space-control-row button {
      flex: 1 1 0;
      min-width: 0;
      width: auto;
    }

    .space-controls button,
    .space-controls label {
      border: 1px solid #cfd6dd;
      border-radius: 6px;
      background: #fff;
      color: #20262d;
      font: 600 12px Arial, "Microsoft YaHei", sans-serif;
      padding: 5px 9px;
      box-sizing: border-box;
    }

    .space-controls button {
      cursor: pointer;
    }

    .space-controls button.is-active {
      background: #20262d;
      color: #fff;
      border-color: #20262d;
    }

    .space-controls label {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 3px;
      min-width: 0;
      overflow: hidden;
    }

    .space-fov-row label {
      flex: 4 1 0;
      width: auto;
      min-width: 0;
      min-height: 40px;
    }

    .space-fov-row button {
      flex: 0 1 72px;
      width: auto;
      max-width: 88px;
      min-width: 56px;
    }

    .space-controls input[type="range"] {
      width: 100%;
      min-width: 0;
      margin: 0;
    }

    .space-controls input[type="range"]:disabled {
      cursor: default;
      opacity: 0.72;
    }

    #front2d {
      touch-action: none;
    }

    .front-controls {
      --front-button-width: 112px;
      --front-row-gap: 1px;
      --front-row-width: calc(var(--front-button-width) * 3 + var(--front-row-gap) * 2);
      z-index: 3;
      display: grid;
      grid-template-rows: 30px 30px 30px minmax(0, 1fr);
      align-items: stretch;
      gap: 3px;
      width: 100%;
      min-width: 0;
      height: 100%;
      pointer-events: auto;
    }

    .front-controls button,
    .front-controls label {
      border: 1px solid #cfd6dd;
      border-radius: 6px;
      background: #fff;
      color: #20262d;
      font: 600 12px Arial, "Microsoft YaHei", sans-serif;
      padding: 5px 9px;
      box-sizing: border-box;
    }

    .front-controls button {
      cursor: pointer;
    }

    .fov-controls {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      align-items: stretch;
      gap: var(--front-row-gap);
      width: 100%;
      min-width: 0;
      min-height: 0;
    }

    .control-group {
      display: flex;
      flex-direction: row;
      align-items: stretch;
      gap: var(--front-row-gap);
      justify-content: flex-end;
      width: 100%;
    }

    .control-group button {
      flex: 1 1 0;
      width: auto;
      min-width: 0;
    }

    .display-mode-controls {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: var(--front-row-gap);
      width: 100%;
    }

    .display-mode-controls button {
      width: auto;
      min-width: 0;
      padding-left: 4px;
      padding-right: 4px;
      font-size: 11px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .front-slider-row {
      display: flex;
      align-items: stretch;
      gap: var(--front-row-gap);
      width: 100%;
      min-width: 0;
      min-height: 0;
    }

    .front-slider-row label {
      flex: 1 1 auto;
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      justify-content: center;
      gap: 2px;
      white-space: nowrap;
      padding-left: 4px;
      padding-right: 4px;
    }

    .front-slider-row label span {
      flex: 0 0 auto;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: 10px;
      line-height: 1.1;
    }

    .front-slider-row input[type="range"] {
      flex: 1 1 auto;
      min-width: 0;
      width: auto;
      margin: 0;
      accent-color: #4b8f6b;
    }

    .front-step-btn {
      flex: 0 0 22px;
      width: 22px;
      min-width: 22px;
      padding-left: 0;
      padding-right: 0;
      text-align: center;
    }

    .symbol-info {
      z-index: 3;
      max-width: 320px;
      border: 1px solid #cfd6dd;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.92);
      color: #20262d;
      font: 12px Arial, "Microsoft YaHei", sans-serif;
      line-height: 1.45;
      padding: 8px 10px;
      pointer-events: none;
    }

    .symbol-info:empty::before {
      content: "点击或拖拽二维点查看注释";
      color: #77818b;
    }

    .symbol-info strong {
      font-size: 13px;
    }

    .front-controls button.is-active {
      border-color: #20262d;
      background: #20262d;
      color: #fff;
    }

    .panel-bottom {
      display: grid;
      grid-template-columns: minmax(72px, 15%) minmax(0, 1fr);
      gap: 0;
      min-width: 0;
      min-height: 0;
      border-top: 1px solid #d7dde3;
      background: #f7f9fb;
    }

    .panel-bottom .space-select-info,
    .panel-bottom .symbol-info {
      position: static;
      width: 100%;
      height: 100%;
      max-width: none;
      min-width: 0;
      min-height: 0;
      box-sizing: border-box;
      border: 0;
      border-right: 1px solid #d7dde3;
      border-radius: 0;
      background: #fbfcfd;
      overflow: auto;
      pointer-events: auto;
    }

    .panel-bottom .space-controls,
    .panel-bottom .front-controls {
      box-sizing: border-box;
      padding: 6px;
    }

    .panel-bottom .space-controls {
      padding: 5px 6px 6px;
    }


    @media (max-width: 900px) {
      .wrap {
        grid-template-columns: 1fr;
        grid-template-rows: 1fr 1fr;
      }

      .panel {
        --panel-bottom-height: clamp(158px, 26vh, 184px);
        grid-template-rows: 30px minmax(0, 1fr) var(--panel-bottom-height);
      }

      .panel-title {
        font-size: 13px;
      }

      .panel-bottom {
        grid-template-columns: minmax(64px, 18%) minmax(0, 1fr);
      }

      .front-controls {
        grid-template-rows: 25px 25px 25px minmax(0, 1fr);
      }

      .front-controls button,
      .front-controls label,
      .space-controls button,
      .space-controls label {
        font-size: 10px;
        padding: 3px 4px;
      }
    }
  </style>
</head>
<body>
<div class="wrap">
  <section class="panel space-panel">
    <div class="panel-title">三维空间</div>
    <div class="space3d-wrap">
      <canvas id="space3d" aria-label="三维空间"></canvas>
      <div id="space3dLabels" class="space-label-layer" aria-hidden="true"></div>
    </div>
    <div class="panel-bottom">
      <div id="spaceSelectInfo" class="space-select-info"></div>
      <div class="space-controls">
        <div class="space-control-row">
          <button id="spaceProjectionToggleBtn" type="button">透视投影</button>
          <button id="spaceResetBtn" type="button">归位（前视图）</button>
          <button id="spaceTopViewBtn" type="button">俯视图</button>
        </div>
        <div class="space-control-row space-side-row">
          <button id="spaceSideViewBtn" type="button">侧视图（CV中心）</button>
          <button id="spaceSideGroundBtn" type="button">侧视图（O中心）</button>
        </div>
        <div class="space-control-row">
          <button id="spaceLabelToggleBtn" type="button">隐藏标注</button>
          <button id="spaceAuxToggleBtn" type="button">隐藏辅助线</button>
          <button id="spaceExampleToggleBtn" type="button">显示实物示例</button>
        </div>
        <div class="space-control-row space-fov-row">
          <label><span id="spaceMatchedFovValue">显示FOV --°</span><input id="spaceMatchedFovSlider" type="range" min="10" max="150" value="90" step="1" disabled></label>
          <button id="spaceFovResetBtn" type="button" disabled>归位</button>
        </div>
      </div>
    </div>
  </section>
  <section class="panel front-panel">
    <div class="panel-title">二维画面</div>
    <svg id="front2d" viewBox="-80 -260 860 1040" role="img" aria-label="三点透视二维画面"></svg>
    <div class="panel-bottom">
      <div id="symbolInfo" class="symbol-info"></div>
      <div class="front-controls">
        <div class="control-group front-main-row">
          <button id="frontResetBtn" type="button">归位</button>
          <button id="frontPConeToggle" type="button">显示视锥</button>
          <button id="frontCvRangeToggle" type="button">显示CV范围</button>
        </div>
        <div class="control-group toggle-controls">
          <button id="frontLabelToggleBtn" type="button">隐藏标注</button>
          <button id="frontAuxToggleBtn" type="button">隐藏辅助线</button>
          <button id="frontExampleToggleBtn" type="button">显示实物示例</button>
        </div>
        <div class="display-mode-controls">
          <button class="display-mode-btn" data-stage="1" type="button">①视点与视距</button>
          <button class="display-mode-btn" data-stage="2" type="button">②灭点</button>
          <button class="display-mode-btn" data-stage="3" type="button">③布局</button>
          <button class="display-mode-btn" data-stage="4" type="button">④透视</button>
        </div>
        <div class="fov-controls">
          <div class="front-slider-row">
            <button class="front-step-btn" data-target="frontFovSlider" data-delta="-1" type="button">−</button>
            <label><span id="frontFovValue">FOV 60°</span><input id="frontFovSlider" type="range" min="1" max="180" value="60" step="1"></label>
            <button class="front-step-btn" data-target="frontFovSlider" data-delta="1" type="button">＋</button>
          </div>
          <div class="front-slider-row">
            <button class="front-step-btn" data-target="frontThetaSlider" data-delta="-1" type="button">−</button>
            <label><span id="frontThetaValue">θ 35°</span><input id="frontThetaSlider" type="range" min="-89" max="89" value="35" step="1"></label>
            <button class="front-step-btn" data-target="frontThetaSlider" data-delta="1" type="button">＋</button>
          </div>
          <div class="front-slider-row">
            <button class="front-step-btn" data-target="frontHorizonRotateSlider" data-delta="-1" type="button">−</button>
            <label><span id="frontHorizonRotateValue">地平线旋转 0°</span><input id="frontHorizonRotateSlider" type="range" min="-180" max="180" value="0" step="1"></label>
            <button class="front-step-btn" data-target="frontHorizonRotateSlider" data-delta="1" type="button">＋</button>
          </div>
          <div class="front-slider-row">
            <button class="front-step-btn" data-target="frontHeightSlider" data-delta="-1" type="button">−</button>
            <label><span id="frontHeightValue">高度 0.0</span><input id="frontHeightSlider" type="range" min="0" max="5" value="0" step="0.1"></label>
            <button class="front-step-btn" data-target="frontHeightSlider" data-delta="1" type="button">＋</button>
          </div>
          <div class="front-slider-row">
            <button class="front-step-btn" data-target="frontRoofDeltaSlider" data-delta="-1" type="button">−</button>
            <label><span id="frontRoofDeltaValue">屋顶δ 30°</span><input id="frontRoofDeltaSlider" type="range" min="1" max="80" value="30" step="1"></label>
            <button class="front-step-btn" data-target="frontRoofDeltaSlider" data-delta="1" type="button">＋</button>
          </div>
        </div>
      </div>
    </div>
  </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
  (() => {
    if (window.THREE && window.THREE.OrbitControls) return;

    class Vector2 {
      constructor(x = 0, y = 0) {
        this.x = x;
        this.y = y;
      }
      set(x, y) {
        this.x = x;
        this.y = y;
        return this;
      }
    }

    class Vector3 {
      constructor(x = 0, y = 0, z = 0) {
        this.x = x;
        this.y = y;
        this.z = z;
      }
      set(x, y, z) {
        this.x = x;
        this.y = y;
        this.z = z;
        return this;
      }
      copy(v) {
        this.x = v.x;
        this.y = v.y;
        this.z = v.z;
        return this;
      }
      clone() {
        return new Vector3(this.x, this.y, this.z);
      }
      add(v) {
        this.x += v.x;
        this.y += v.y;
        this.z += v.z;
        return this;
      }
      sub(v) {
        this.x -= v.x;
        this.y -= v.y;
        this.z -= v.z;
        return this;
      }
      subVectors(a, b) {
        this.x = a.x - b.x;
        this.y = a.y - b.y;
        this.z = a.z - b.z;
        return this;
      }
      addVectors(a, b) {
        this.x = a.x + b.x;
        this.y = a.y + b.y;
        this.z = a.z + b.z;
        return this;
      }
      addScaledVector(v, s) {
        this.x += v.x * s;
        this.y += v.y * s;
        this.z += v.z * s;
        return this;
      }
      multiplyScalar(s) {
        this.x *= s;
        this.y *= s;
        this.z *= s;
        return this;
      }
      dot(v) {
        return this.x * v.x + this.y * v.y + this.z * v.z;
      }
      crossVectors(a, b) {
        const x = a.y * b.z - a.z * b.y;
        const y = a.z * b.x - a.x * b.z;
        const z = a.x * b.y - a.y * b.x;
        this.x = x;
        this.y = y;
        this.z = z;
        return this;
      }
      lengthSq() {
        return this.x * this.x + this.y * this.y + this.z * this.z;
      }
      length() {
        return Math.sqrt(this.lengthSq());
      }
      normalize() {
        const n = this.length();
        if (n > 1e-12) this.multiplyScalar(1 / n);
        return this;
      }
      distanceTo(v) {
        return Math.sqrt((this.x - v.x) ** 2 + (this.y - v.y) ** 2 + (this.z - v.z) ** 2);
      }
      lerp(v, a) {
        this.x += (v.x - this.x) * a;
        this.y += (v.y - this.y) * a;
        this.z += (v.z - this.z) * a;
        return this;
      }
      applyAxisAngle(axis, angle) {
        const k = axis.clone().normalize();
        const v = this.clone();
        const cos = Math.cos(angle);
        const sin = Math.sin(angle);
        const cross = new Vector3().crossVectors(k, v);
        this.copy(v.multiplyScalar(cos).add(cross.multiplyScalar(sin)).add(k.multiplyScalar(k.dot(this) * (1 - cos))));
        return this;
      }
      project(camera) {
        return camera.projectVector(this);
      }
    }

    class Object3D {
      constructor() {
        this.children = [];
        this.parent = null;
        this.position = new Vector3();
        this.userData = {};
        this.renderOrder = 0;
      }
      add(child) {
        child.parent = this;
        this.children.push(child);
        return this;
      }
      remove(child) {
        const index = this.children.indexOf(child);
        if (index >= 0) {
          this.children.splice(index, 1);
          child.parent = null;
        }
        return this;
      }
    }

    class Scene extends Object3D {}
    class Group extends Object3D {}

    class Camera extends Object3D {
      constructor() {
        super();
        this.up = new Vector3(0, 0, -1);
        this.target = new Vector3();
        this.quaternion = { copy: () => this.quaternion };
        this.near = 1;
        this.far = 80000;
      }
      lookAt(target) {
        this.target.copy(target);
        return this;
      }
      updateProjectionMatrix() {}
      updateMatrixWorld() {}
      basis() {
        const forward = new Vector3().subVectors(this.target, this.position);
        if (forward.lengthSq() < 1e-12) forward.set(0, -1, 0);
        forward.normalize();
        let right = new Vector3().crossVectors(forward, this.up);
        if (right.lengthSq() < 1e-12) right.set(1, 0, 0);
        right.normalize();
        let up = new Vector3().crossVectors(right, forward);
        if (up.lengthSq() < 1e-12) up.copy(this.up);
        up.normalize();
        return { forward, right, up };
      }
      cameraCoords(v) {
        const rel = new Vector3().subVectors(v, this.position);
        const basis = this.basis();
        return {
          x: rel.dot(basis.right),
          y: rel.dot(basis.up),
          z: rel.dot(basis.forward)
        };
      }
      projectVector(v) {
        const c = this.cameraCoords(v);
        if (this.isOrthographicCamera) {
          const halfW = Math.max(1e-6, (this.right - this.left) / 2);
          const halfH = Math.max(1e-6, (this.top - this.bottom) / 2);
          return new Vector3(c.x / halfW, c.y / halfH, 0);
        }
        const fov = Math.max(1, Math.min(179, this.fov || 60)) * Math.PI / 180;
        const z = Math.max(1e-6, c.z);
        const halfH = Math.tan(fov / 2) * z;
        const halfW = halfH * (this.aspect || 1);
        return new Vector3(c.x / Math.max(1e-6, halfW), c.y / Math.max(1e-6, halfH), c.z > 0 ? 0 : 2);
      }
    }

    class PerspectiveCamera extends Camera {
      constructor(fov, aspect, near, far) {
        super();
        this.fov = fov;
        this.aspect = aspect;
        this.near = near;
        this.far = far;
        this.isPerspectiveCamera = true;
      }
    }

    class OrthographicCamera extends Camera {
      constructor(left, right, top, bottom, near, far) {
        super();
        this.left = left;
        this.right = right;
        this.top = top;
        this.bottom = bottom;
        this.near = near;
        this.far = far;
        this.isOrthographicCamera = true;
      }
    }

    class Float32BufferAttribute {
      constructor(array, itemSize) {
        this.array = Array.from(array);
        this.itemSize = itemSize;
      }
    }

    class BufferGeometry {
      constructor() {
        this.attributes = {};
        this.index = null;
        this.points = null;
      }
      setFromPoints(points) {
        this.points = points.map(p => p.clone());
        this.setAttribute('position', new Float32BufferAttribute(points.flatMap(p => [p.x, p.y, p.z]), 3));
        return this;
      }

    return nextCamera;
  }

  function syncSpace3dCameraProjection() {
    if (!space3d) return;
    const rect = space3d.canvas.getBoundingClientRect();
    const aspect = Math.max(1e-6, rect.width / Math.max(1, rect.height));
    const fovDeg = Math.max(10, Math.min(150, SPACE3D_STATE.displayFovDeg || SPACE3D_STATE.matchedFovDeg || 90));

    space3d.perspectiveCamera.aspect = aspect;
    space3d.perspectiveCamera.fov = fovDeg;
    space3d.perspectiveCamera.near = 1;
    space3d.perspectiveCamera.far = 80000;
    space3d.perspectiveCamera.updateProjectionMatrix();

    const target = space3d.controls ? space3d.controls.target : new THREE.Vector3();
    let distance = space3d.camera ? space3d.camera.position.distanceTo(target) : 940;
    if (!Number.isFinite(distance) || distance < 1) distance = 940;
    const viewHeight = Math.max(10, 2 * distance * Math.tan(fovDeg * Math.PI / 360));
    const viewWidth = viewHeight * aspect;
    const ortho = space3d.orthographicCamera;
    ortho.left = -viewWidth / 2;
    ortho.right = viewWidth / 2;
    ortho.top = viewHeight / 2;
    ortho.bottom = -viewHeight / 2;
    ortho.near = 1;
    ortho.far = 80000;
    ortho.updateProjectionMatrix();
  }

  function initSpace3d() {
    const canvas = document.getElementById('space3d');
    const labelLayer = document.getElementById('space3dLabels');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setClearColor(0xffffff, 1);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));

    const scene = new THREE.Scene();
    const perspectiveCamera = new THREE.PerspectiveCamera(90, 1, 1, 80000);
    perspectiveCamera.position.set(0, 1000, 140);
    perspectiveCamera.up.set(0, 0, -1);

    const orthographicCamera = new THREE.OrthographicCamera(-470, 470, 470, -470, 1, 80000);
    orthographicCamera.position.copy(perspectiveCamera.position);
    orthographicCamera.up.copy(perspectiveCamera.up);
    orthographicCamera.lookAt(new THREE.Vector3(0, 0, 140));

    const camera = SPACE3D_STATE.projectionMode === 'orthographic' ? orthographicCamera : perspectiveCamera;
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.target.set(0, 0, 140);
    controls.addEventListener('change', () => {
      syncSpace3dCameraProjection();
      renderSpace3dNow();
      updateSpace3dLabels();
    });

    const dynamicGroup = new THREE.Group();
    scene.add(dynamicGroup);
    const raycaster = new THREE.Raycaster();
    raycaster.params.Line.threshold = 7;
    const pointer = new THREE.Vector2();
    let pickStart = null;
    canvas.addEventListener('pointerdown', (event) => {
      pickStart = { x: event.clientX, y: event.clientY };
    });
    canvas.addEventListener('pointerup', (event) => {
      if (!pickStart) return;
      const moved = Math.hypot(event.clientX - pickStart.x, event.clientY - pickStart.y);
      pickStart = null;
      if (moved <= 4) handleSpace3dPick(event);
    });

    space3d = {
      canvas,
      labelLayer,
      renderer,
      scene,
      camera,
      perspectiveCamera,
      orthographicCamera,
      controls,
      dynamicGroup,
      raycaster,
      pointer
    };
    resizeSpace3d();
    syncSpace3dActiveCamera();
    syncSpace3dCameraProjection();

    const animate = () => {
      if (!space3d) return;
      requestAnimationFrame(animate);
      controls.update();
      renderSpace3dNow();
      updateSpace3dLabels();
    };
    animate();
  }

  function resizeSpace3d() {
    if (!space3d) return;
    const { canvas, renderer } = space3d;
    const rect = canvas.getBoundingClientRect();
    const width = Math.max(1, Math.floor(rect.width));
    const height = Math.max(1, Math.floor(rect.height));
    renderer.setSize(width, height, false);
    syncSpace3dCameraProjection();
  }

  function updateSpace3d(points) {
    lastSpace3dPayload = points;
    if (!space3d || !points || !points.roof) return;

    syncSpace3dActiveCamera();
    const { dynamicGroup, labelLayer, controls, renderer } = space3d;
    const camera = space3d.camera;
    while (dynamicGroup.children.length) {
      disposeSpace3dObject(dynamicGroup.children[0]);
      dynamicGroup.remove(dynamicGroup.children[0]);
    }
    labelLayer.innerHTML = '';
    space3dLabels = [];

    const spaceTransform = space3dTransformFromPoints(points);
    const toSpace = (point) => mapToSpace3d(point, spaceTransform);
    const mapped = {
      VPL: toSpace(points.vpl),
      VPR: toSpace(points.vpr),
      VP1: toSpace(points.vpl),
      VP2: toSpace(points.vpr),
      VP3: toSpace(points.vp3 || points.third.vp3),
      O: toSpace(points.o || points.third.o),
      'P(Q2)': toSpace(points.q2),
      'P(Q1)': toSpace(points.q1),
      CV: toSpace(points.cv),
      P1: toSpace(points.observer),
      P: toSpace(points.observer),
      PlanP: toSpace(points.planObserver || points.observer),
      P2: toSpace(points.ground ? points.ground.p2 : points.observer),
      "VP1'": toSpace(points.vpl),
      "VP2'": toSpace(points.vpr),
      "A'": toSpace(points.e),
      "A''": toSpace(points.f),
      S: toSpace(points.s || points.e),
      T: toSpace(points.t || points.f),
      Y: toSpace(points.y),
      a: toSpace(points.a),
      A: toSpace(points.A)
    };

    const p0 = space3dP0Point(mapped, spaceTransform);
    const pictureFrame = space3dPictureFrame(mapped, p0);
    const model = buildSpace3dModel(points, spaceTransform, mapped, p0, pictureFrame);
    const matchedFov = space3dMatchedDisplayFov(mapped, p0, pictureFrame);
    SPACE3D_STATE.matchedFovDeg = matchedFov;
    SPACE3D_STATE.forcedFovDeg = null;
    SPACE3D_STATE.displayFovDeg = matchedFov;
    syncSpace3dCameraProjection();
    syncSpace3dControls();

    renderer.setClearColor(SPACE3D_STATE.showExamples ? 0xdff1ff : 0xffffff, 1);
    if (SPACE3D_STATE.showExamples) addSpace3dWorldExample(dynamicGroup, model, mapped, p0);
    addSpace3dModel(dynamicGroup, model);
    if (SPACE3D_STATE.showAux) {
      const viewLevelSegment = space3dPictureHorizontalSegment(pictureFrame, mapped.CV);
      const viewHeightSegment = space3dPictureHorizontalSegment(pictureFrame, mapped.O);
      addSpace3dFrame(dynamicGroup, pictureFrame, SVG_COLORS.gray, 1.5);
      addSpace3dFace(dynamicGroup, pictureFrame.corners, '#ffffff', 0, '画面');
      addSpace3dFace(dynamicGroup, [viewLevelSegment[0], viewLevelSegment[1], p0], '#dff3eb', 0.26, '视平面');
      addSpace3dFace(dynamicGroup, [viewHeightSegment[0], viewHeightSegment[1], p0], '#e8eef8', 0.22, '视高面');
      addSpace3dInfiniteLine(dynamicGroup, mapped.CV, p0, '视线');
      addSpace3dInfiniteLine(dynamicGroup, viewLevelSegment[0], viewLevelSegment[1], '视平线');
      addSpace3dInfiniteLine(dynamicGroup, viewHeightSegment[0], viewHeightSegment[1], '地平线');
      addSpace3dInfiniteGuideLine(dynamicGroup, mapped.CV, mapped.O);
      addSpace3dLine(dynamicGroup, viewLevelSegment[0], viewLevelSegment[1], SVG_COLORS.green, 1.2);
      addSpace3dLine(dynamicGroup, viewHeightSegment[0], viewHeightSegment[1], SVG_COLORS.black, 1.6);
      addSpace3dLine(dynamicGroup, mapped.CV, mapped.P1, SVG_COLORS.green, 1.4);
      addSpace3dLine(dynamicGroup, mapped.P1, mapped.O, SVG_COLORS.orange, 1.2);
      addSpace3dLine(dynamicGroup, mapped.P1, mapped.VP3, SVG_COLORS.purple, 1.2);
      addSpace3dLine(dynamicGroup, mapped.O, mapped.VP3, SVG_COLORS.gray, 1);
      addSpace3dLine(dynamicGroup, mapped.CV, p0, SVG_COLORS.green, 1.8);
      addSpace3dLine(dynamicGroup, mapped.O, p0, SVG_COLORS.orange, 1.2);
      addSpace3dLine(dynamicGroup, mapped.PlanP, mapped.VPL, SVG_COLORS.blue, 1.2);
      addSpace3dLine(dynamicGroup, mapped.PlanP, mapped.VPR, SVG_COLORS.yellow, 1.2);
      addSpace3dLine(dynamicGroup, p0, mapped.VPL, SVG_COLORS.blue, 1.2);
      addSpace3dLine(dynamicGroup, p0, mapped.VPR, SVG_COLORS.yellow, 1.2);
      addSpace3dRay(dynamicGroup, model.vertices.a, new THREE.Vector3().subVectors(mapped.VP1, p0), SVG_COLORS.blue, 0.16, 0.36);
      addSpace3dRay(dynamicGroup, model.vertices.a, new THREE.Vector3().subVectors(mapped.VP2, p0), SVG_COLORS.yellow, 0.16, 0.36);
      addSpace3dVanishingOriginLabels(dynamicGroup, mapped, model, p0);
      addSpace3dConstructionRays(dynamicGroup, mapped, model, p0);
      if (mapped.Y && mapped.S && mapped.T) {
        addSpace3dLine(dynamicGroup, mapped.VP3, mapped.Y, SVG_COLORS.green, 1.0);
        addSpace3dLine(dynamicGroup, mapped.Y, mapped.S, SVG_COLORS.green, 1.0);
        addSpace3dLine(dynamicGroup, mapped.A, mapped.S, SVG_COLORS.orange, 1.0);
        addSpace3dLine(dynamicGroup, mapped.A, mapped.T, SVG_COLORS.orange, 1.0);
        addSpace3dLine(dynamicGroup, mapped.S, mapped['P(Q1)'], SVG_COLORS.half, 1.0);
        addSpace3dLine(dynamicGroup, mapped.T, mapped['P(Q2)'], SVG_COLORS.half, 1.0);
        addSpace3dPoint(dynamicGroup, mapped.S, SVG_COLORS.orange, 'S');
        addSpace3dPoint(dynamicGroup, mapped.T, SVG_COLORS.orange, 'T');
        addSpace3dPoint(dynamicGroup, mapped.Y, SVG_COLORS.green, 'Y');
        addSpace3dLabel('S', mapped.S, SVG_COLORS.orange);
        addSpace3dLabel('T', mapped.T, SVG_COLORS.orange);
        addSpace3dLabel('Y', mapped.Y, SVG_COLORS.green);
        const stVector = new THREE.Vector3().subVectors(mapped.T, mapped.S);
        if (stVector.lengthSq() > 1e-6) {
          const halfSt = stVector.clone().multiplyScalar(0.5);
          const sPrime = model.vertices.A.clone().sub(halfSt);
          const tPrime = model.vertices.A.clone().add(halfSt);
          addSpace3dLine(dynamicGroup, sPrime, tPrime, SVG_COLORS.orange, 1.2);
          addSpace3dPoint(dynamicGroup, sPrime, SVG_COLORS.orange, 'S′');
          addSpace3dPoint(dynamicGroup, tPrime, SVG_COLORS.orange, 'T′');
          addSpace3dLabel('S′', sPrime, SVG_COLORS.orange);
          addSpace3dLabel('T′', tPrime, SVG_COLORS.orange);
          addSpace3dAngle(dynamicGroup, 'β', model.vertices.A, sPrime, model.vertices.B, SVG_COLORS.yellow, 24);
          addSpace3dAngle(dynamicGroup, 'α', model.vertices.A, model.vertices.C, tPrime, SVG_COLORS.blue, 24);
        }
      }
      addSpace3dAngle(dynamicGroup, 'θ', p0, mapped.O, mapped.CV, SVG_COLORS.green, 32, 'θ');
    }

    for (const name of SPACE3D_LABELS) {
      const color = space3dColorFor(name);
      addSpace3dPoint(dynamicGroup, mapped[name], color, name);
      addSpace3dLabel(name, mapped[name], color);
    }
    addSpace3dPoint(dynamicGroup, p0, SVG_COLORS.green, 'P⁰');
    addSpace3dLabel('P⁰', p0, SVG_COLORS.green);
    if (SPACE3D_STATE.showExamples) addSpace3dExamplePeople(dynamicGroup, mapped, p0, points, spaceTransform, model);

    if (!space3dCentered) {
      applySpace3dView(camera, controls, pictureFrame, p0, mapped, SPACE3D_STATE.viewMode, model);
      space3dCentered = true;
    }
    controls.update();
    renderer.render(space3d.scene, camera);
    updateSpace3dLabels();
    showSpace3dSelectionInfo();
  }

  function space3dRotateVectorAroundAxis(vector, axis, angleRad) {
    const v = vector.clone();
    const k = axis.clone();
    if (k.lengthSq() < 1e-9 || Math.abs(angleRad) < 1e-12) return v;
    k.normalize();
    const cos = Math.cos(angleRad);
    const sin = Math.sin(angleRad);
    return v.multiplyScalar(cos)
      .add(new THREE.Vector3().crossVectors(k, vector).multiplyScalar(sin))
      .add(k.multiplyScalar(k.dot(vector) * (1 - cos)));
  }

  function space3dTransformFromPoints(points) {
    const oPoint = points.o || (points.third && points.third.o) || { x: 350, y: 170 };
    const thetaDeg = points.third && Number.isFinite(points.third.thetaDeg)
      ? points.third.thetaDeg
      : FRONT2D_STATE.thetaDeg;
    const theta = thetaDeg * Math.PI / 180;
    const rollDeg = Number.isFinite(points.horizonRotateDeg)
      ? points.horizonRotateDeg
      : (Number.isFinite(FRONT2D_STATE.horizonRotateDeg) ? FRONT2D_STATE.horizonRotateDeg : 0);
    // SVG 坐标系 y 轴向下，正角度视觉上是顺时针；在 Three.js 右手系里要取反才能一致。
    const roll = -rollDeg * Math.PI / 180;
    const normal = new THREE.Vector3(0, Math.cos(theta), -Math.sin(theta)).normalize();
    const baseAxisX = new THREE.Vector3(1, 0, 0);
    const baseAxisY = new THREE.Vector3(0, Math.sin(theta), Math.cos(theta));
    const axisX = space3dRotateVectorAroundAxis(baseAxisX, normal, roll).normalize();
    const axisY = space3dRotateVectorAroundAxis(baseAxisY, normal, roll).normalize();
    return {
      pivot: new THREE.Vector3(oPoint.x - 350, 0, oPoint.y - 170),
      origin2d: oPoint,
      sin: Math.sin(theta),
      cos: Math.cos(theta),
      normal,
      axisX,
      axisY,
      horizonRotateDeg: rollDeg
    };
  }

  function mapToSpace3d(point, transform = null) {
    const t = transform || space3dTransformFromPoints(lastFront2dPayload || {});
    const dx = point.x - t.origin2d.x;
    const dy = point.y - t.origin2d.y;
    const axisX = t.axisX || new THREE.Vector3(1, 0, 0);
    const axisY = t.axisY || new THREE.Vector3(0, t.sin || 0, t.cos || 1);
    return t.pivot.clone()
      .addScaledVector(axisX, dx)
      .addScaledVector(axisY, dy);
  }

  function space3dP0Point(mapped, transform) {
    // P⁰-CV 是视线，P⁰ 必须在画面中心 CV 的法线上。
    // 视距不再靠 “P⁰.z = O.z” 这种固定水平假设，而是直接取二维构图中的 CV-P1 距离。
    const base = mapped.CV || mapped.O;
    const dir = transform && transform.normal
      ? transform.normal.clone()
      : new THREE.Vector3(0, 1, 0);
    if (dir.lengthSq() < 1e-9) dir.set(0, 1, 0);
    dir.normalize();

    const reference = mapped.P1 || mapped.P || mapped.PlanP || mapped.P2;
    let length = reference ? reference.distanceTo(base) : 0;
    if (length < 1e-6 && mapped.PlanP && mapped.O) length = mapped.PlanP.distanceTo(mapped.O);
    if (length < 1e-6) length = MIN_P_CV_DISTANCE;
    return base.clone().addScaledVector(dir, length);
  }

  function space3dPictureFrame(mapped, p0) {
    const axis = new THREE.Vector3().subVectors(mapped.VPR, mapped.VPL);
    const span = Math.max(1, axis.length());
    axis.normalize();

    const normal = new THREE.Vector3().subVectors(p0, mapped.CV || mapped.O);
    if (normal.lengthSq() < 1e-6) normal.set(0, 1, 0);
    normal.normalize();

    const up = new THREE.Vector3().crossVectors(normal, axis);
    if (up.lengthSq() < 1e-6) up.set(0, 0, -1);
    up.normalize();

    const center = (mapped.CV || mapped.O).clone();
    const size = Math.max(
      span,
      center.distanceTo(mapped.VPL) * 2,
      center.distanceTo(mapped.VPR) * 2
    ) * 1.12;
    const half = size / 2;
    return {
      name: '画面',
      center,
      axis,
      up,
      size,
      width: size,
      height: size,
      corners: [
        center.clone().addScaledVector(axis, -half).addScaledVector(up, half),
        center.clone().addScaledVector(axis, half).addScaledVector(up, half),
        center.clone().addScaledVector(axis, half).addScaledVector(up, -half),
        center.clone().addScaledVector(axis, -half).addScaledVector(up, -half)
      ]
    };
  }

  function space3dPictureHorizontalSegment(pictureFrame, pointOnPlane) {
    const half = Math.max(1, (pictureFrame.width || pictureFrame.size || 1) / 2);
    const offset = new THREE.Vector3().subVectors(pointOnPlane, pictureFrame.center).dot(pictureFrame.up);
    const mid = pictureFrame.center.clone().addScaledVector(pictureFrame.up, offset);
    return [
      mid.clone().addScaledVector(pictureFrame.axis, -half),
      mid.clone().addScaledVector(pictureFrame.axis, half)
    ];
  }

  function space3dReferencePlane(mapped, model) {
    const baseLeft = mapped["A'"].clone();
    const baseRight = mapped["A''"].clone();
    const upDir = model && model.upDir ? model.upDir.clone().normalize() : new THREE.Vector3(0, 0, -1);
    const refTop = model && model.vertices && model.vertices.A ? model.vertices.A : baseLeft.clone().addScaledVector(upDir, 80);
    const refBase = model && model.vertices && model.vertices.a ? model.vertices.a : baseLeft;
    const height = new THREE.Vector3().subVectors(refTop, refBase).dot(upDir);
    const topRight = baseRight.clone().addScaledVector(upDir, height);
    const topLeft = baseLeft.clone().addScaledVector(upDir, height);
    return [baseLeft, baseRight, topRight, topLeft];
  }

  function space3dMatchedDisplayFov(mapped, p0, pictureFrame = null) {
    const frontSvg = document.getElementById('front2d');
    const viewHeight = frontSvg && frontSvg.viewBox && frontSvg.viewBox.baseVal
      ? frontSvg.viewBox.baseVal.height
      : 940;
    const displayHeight = pictureFrame && Number.isFinite(pictureFrame.height)
      ? pictureFrame.height
      : viewHeight;
    const eyeDistance = Math.max(1, p0.distanceTo(mapped.CV || mapped.O));
    const fovDeg = 2 * Math.atan(displayHeight / (2 * eyeDistance)) * 180 / Math.PI;
    return Math.max(10, Math.min(150, fovDeg));
  }

  function applySpace3dView(camera, controls, pictureFrame, p0, mapped, mode, model = null) {
    const normal = new THREE.Vector3().subVectors(p0, mapped.CV || mapped.O);
    if (normal.lengthSq() < 1e-6) normal.set(0, 1, 0);
    normal.normalize();

    const baseTarget = mapped.CV || mapped.O;
    const distance = Math.max(1, p0.distanceTo(mapped.CV || mapped.O));
    const position = new THREE.Vector3();
    let target = baseTarget.clone();
    let up = pictureFrame.up.clone();
    const worldUp = model && model.upDir && model.upDir.lengthSq() > 1e-6
      ? model.upDir.clone().normalize()
      : pictureFrame.up.clone().normalize();

    if (mode === 'top') {
      target = model && model.vertices
        ? new THREE.Vector3().add(model.vertices.a).add(model.vertices.b).add(model.vertices.c).add(model.vertices.d).multiplyScalar(0.25)
        : baseTarget.clone();
      position.copy(target).addScaledVector(worldUp, distance);
      up = normal.clone();
    } else if (mode === 'sideFrame') {
      target = pictureFrame.center.clone();
      position.copy(target).addScaledVector(pictureFrame.axis, distance);
      up = pictureFrame.up.clone();
    } else if (mode === 'sideGround') {
      target = model && model.vertices
        ? new THREE.Vector3().add(model.vertices.a).add(model.vertices.b).add(model.vertices.c).add(model.vertices.d).multiplyScalar(0.25)
        : mapped.O.clone();
      position.copy(target).addScaledVector(pictureFrame.axis, distance);
      up = worldUp.clone();
    } else {
      target = baseTarget.clone();
      position.copy(p0);
      up = pictureFrame.up.clone();
    }

    controls.target.copy(target);
    camera.up.copy(up);
    camera.position.copy(position);
    camera.lookAt(target);
    syncSpace3dCameraProjection();
  }

  function addSpace3dWorldExample(group, model, mapped, p0) {
    const v = model.vertices;
    const groundCenter = new THREE.Vector3()
      .add(v.a).add(v.b).add(v.c).add(v.d)
      .multiplyScalar(0.25);
    const size = 32000;
    const groundNormal = model.groundNormal && model.groundNormal.lengthSq() > 1e-6
      ? model.groundNormal.clone().normalize()
      : new THREE.Vector3(0, 0, 1);
    const upDir = model.upDir && model.upDir.lengthSq() > 1e-6
      ? model.upDir.clone().normalize()
      : groundNormal.clone();

    const skyGeometry = new THREE.SphereGeometry(size * 0.72, 40, 20);
    const skyMaterial = new THREE.MeshBasicMaterial({
      color: 0xdff1ff,
      side: THREE.BackSide,
      depthWrite: false
    });
    const sky = new THREE.Mesh(skyGeometry, skyMaterial);
    sky.position.copy(groundCenter).addScaledVector(upDir, size * 0.25);
    group.add(sky);

    const back = new THREE.Vector3().subVectors(mapped.CV || mapped.O, p0);
    if (back.lengthSq() < 1e-6) back.set(0, -1, 0);
    back.addScaledVector(groundNormal, -back.dot(groundNormal));
    if (back.lengthSq() < 1e-6 && mapped.VP1) back.subVectors(mapped.VP1, p0).addScaledVector(groundNormal, -new THREE.Vector3().subVectors(mapped.VP1, p0).dot(groundNormal));
    if (back.lengthSq() < 1e-6) back.set(1, 0, 0);
    back.normalize();
    const side = new THREE.Vector3().crossVectors(groundNormal, back);
    if (side.lengthSq() < 1e-6) side.set(1, 0, 0);
    side.normalize();

    const near = groundCenter.clone().addScaledVector(back, -size * 0.38);
    const far = groundCenter.clone().addScaledVector(back, size);
    const ground = [
      near.clone().addScaledVector(side, -size),
      near.clone().addScaledVector(side, size),
      far.clone().addScaledVector(side, size),
      far.clone().addScaledVector(side, -size)
    ];
    addSpace3dFace(group, ground, '#ead6bd', 0.84);
  }

  function addSpace3dExamplePeople(group, mapped, p0, points, transform, model = null) {
    const frame = space3dExampleFrame(mapped, p0);
    const upDir = model && model.upDir && model.upDir.lengthSq() > 1e-6
      ? model.upDir.clone().normalize()
      : frame.up.clone().normalize();
    const downDir = upDir.clone().multiplyScalar(-1);
    let groundPoint = model && model.groundPlane
      ? space3dRayPlaneIntersection(p0, downDir, model.groundPlane.point, model.groundPlane.normal)
      : null;
    if (groundPoint && new THREE.Vector3().subVectors(groundPoint, p0).dot(downDir) < 0) {
      groundPoint = space3dRayPlaneIntersection(p0, upDir, model.groundPlane.point, model.groundPlane.normal);
    }
    const footPoint = groundPoint || p0.clone().addScaledVector(downDir, Math.max(48, mapped.O ? mapped.O.distanceTo(mapped.CV || mapped.O) : 120));
    const height = Math.max(48, Math.min(1400, footPoint.distanceTo(p0)));
    const leftTarget = space3dVpOriginArmTarget(p0, mapped.VP1 || mapped.VPL, footPoint, upDir, height);
    const rightTarget = space3dVpOriginArmTarget(p0, mapped.VP2 || mapped.VPR, footPoint, upDir, height);
    addSpace3dHingedPerson(group, p0, height, footPoint, frame.axis, frame.up, frame.normal, leftTarget, rightTarget, 1, upDir);

  }

  function space3dVpOriginArmTarget(eye, vanishPoint, origin, upDir, height) {
    const dir = new THREE.Vector3().subVectors(vanishPoint, eye);
    const groundUp = upDir && upDir.lengthSq() > 1e-6
      ? upDir.clone().normalize()
      : new THREE.Vector3(0, 0, -1);
    dir.addScaledVector(groundUp, -dir.dot(groundUp));
    if (dir.lengthSq() < 1e-6) dir.subVectors(vanishPoint, eye);
    if (dir.lengthSq() < 1e-6) dir.set(1, 0, 0);
    dir.normalize();
    return origin.clone().addScaledVector(dir, Math.max(1200, height * 12));
  }

  function space3dExampleFrame(mapped, p0) {
    const axis = new THREE.Vector3().subVectors(mapped.VPR, mapped.VPL);
    if (axis.lengthSq() < 1e-6) axis.set(1, 0, 0);
    axis.normalize();

    const normal = new THREE.Vector3().subVectors(p0, mapped.CV || mapped.O);
    if (normal.lengthSq() < 1e-6) normal.set(0, 1, 0);
    normal.normalize();

    const up = new THREE.Vector3().crossVectors(normal, axis);
    if (up.lengthSq() < 1e-6) up.set(0, 0, -1);
    up.normalize();
    if (up.z > 0) up.multiplyScalar(-1);
    return { axis, normal, up };
  }

  function space3dRayDisplayPoint(origin, direction, distanceValue) {
    const dir = direction.clone();
    if (dir.lengthSq() < 1e-6) dir.set(1, 0, 0);

  function addSpace3dHingedPerson(group, eye, height, groundPoint, axis, headUp, faceNormal, leftTarget, rightTarget, opacity, upDir = null) {
    const shoulder = axis.clone();
    if (shoulder.lengthSq() < 1e-6) shoulder.set(1, 0, 0);
    shoulder.normalize();

    const headUpDir = headUp.clone();
    if (headUpDir.lengthSq() < 1e-6) headUpDir.set(0, 0, -1);
    headUpDir.normalize();
    if (headUpDir.z > 0) headUpDir.multiplyScalar(-1);
    const headDown = headUpDir.clone().multiplyScalar(-1);

    const bodyDown = upDir && upDir.lengthSq() > 1e-6
      ? upDir.clone().normalize().multiplyScalar(-1)
      : new THREE.Vector3(0, 0, 1);
    const faceDir = faceNormal.clone();
    if (faceDir.lengthSq() < 1e-6) faceDir.set(0, 1, 0);
    faceDir.normalize();

    const headR = height / 13;
    const torsoHalf = height * 0.105;
    const torsoRy = Math.max(5, height * 0.17);
    const pelvisRx = height * 0.082;
    const pelvisRy = Math.max(2.4, height * 0.045);
    const legAnchorHalf = pelvisRx * 0.52;
    const footHalf = height * 0.055;
    const handR = height * 0.030;
    const footR = height * 0.034;
    const armLength = height * 0.43;

    const headCenter = eye.clone().addScaledVector(headDown, headR * 0.18);
    const hinge = headCenter.clone().addScaledVector(headDown, headR * 0.92);
    const bodyNeck = hinge.clone().addScaledVector(bodyDown, Math.max(2, height * 0.035));
    const torsoCenter = bodyNeck.clone().addScaledVector(bodyDown, torsoRy);
    const pelvisCenter = torsoCenter.clone().addScaledVector(bodyDown, torsoRy + pelvisRy * 0.65);
    const bodyCenter = torsoCenter.clone().lerp(pelvisCenter, 0.45);
    const leftHip = pelvisCenter.clone().addScaledVector(shoulder, -legAnchorHalf).addScaledVector(bodyDown, pelvisRy * 0.20);
    const rightHip = pelvisCenter.clone().addScaledVector(shoulder, legAnchorHalf).addScaledVector(bodyDown, pelvisRy * 0.20);
    const footCenter = groundPoint && groundPoint.isVector3
      ? groundPoint.clone().addScaledVector(bodyDown, -footR * 0.8)
      : eye.clone().addScaledVector(bodyDown, height - footR * 0.8);
    const leftFoot = footCenter.clone().addScaledVector(shoulder, -footHalf);
    const rightFoot = footCenter.clone().addScaledVector(shoulder, footHalf);
    const leftHand = space3dPointToward(bodyCenter, leftTarget, armLength, shoulder.clone().multiplyScalar(-1));
    const rightHand = space3dPointToward(bodyCenter, rightTarget, armLength, shoulder);
    const headNeck = headCenter.clone().addScaledVector(headDown, headR * 0.72);

    addSpace3dExampleLine(group, headNeck, hinge, opacity);
    addSpace3dExampleLine(group, hinge, bodyNeck, opacity);
    addSpace3dExampleLine(group, bodyCenter, leftHand, opacity);
    addSpace3dExampleLine(group, bodyCenter, rightHand, opacity);
    addSpace3dExampleLine(group, leftHip, leftFoot, opacity);
    addSpace3dExampleLine(group, rightHip, rightFoot, opacity);
    addSpace3dExampleEllipse(group, torsoCenter, shoulder, bodyDown, torsoHalf, torsoRy, opacity);
    addSpace3dExampleEllipse(group, pelvisCenter, shoulder, bodyDown, pelvisRx, pelvisRy, opacity);
    addSpace3dExampleEllipse(group, headCenter, shoulder, headDown, headR * 0.82, headR * 1.12, opacity);
    addSpace3dExampleNose(group, eye.clone().addScaledVector(headDown, headR * 0.18), faceDir, shoulder, headR * 0.28, opacity);
    addSpace3dExampleDisc(group, leftHand, handR, opacity);
    addSpace3dExampleDisc(group, rightHand, handR, opacity);
    addSpace3dExampleEllipse(group, leftFoot, shoulder, bodyDown, footR * 1.5, footR * 0.8, opacity);
    addSpace3dExampleEllipse(group, rightFoot, shoulder, bodyDown, footR * 1.5, footR * 0.8, opacity);
    addSpace3dExampleEye(group, eye, Math.max(1.2, height * 0.018), opacity);
    addSpace3dExampleEye(group, hinge, Math.max(1.0, height * 0.011), opacity);
  }

  function addSpace3dFrontPerson(group, eye, height, axis, up, leftTarget, rightTarget, noseDir, opacity) {

  function addSpace3dSidePerson(group, eye, height, up, sideDir, lookTarget, secondTarget, opacity) {

  function addSpace3dTopPerson(group, eye, height, axis, forward, leftTarget, rightTarget, cvPoint, opacity) {
    const shoulderDir = axis.clone();
    if (shoulderDir.lengthSq() < 1e-6) shoulderDir.set(1, 0, 0);

    );
    addSpace3dExampleEllipse(group, eye, shoulderDir, bodyDir, topLen / 2, topWidth / 2, opacity);
    addSpace3dExampleEllipse(group, eye, shoulderDir, bodyDir, headR * 1.12, headR * 0.82, opacity);
    addSpace3dExampleNose(group, eye, noseDir, shoulderDir, headR * 0.28, opacity);

  function space3dPointToward(from, to, lengthValue, fallback) {
    const dir = new THREE.Vector3().subVectors(to, from);
    if (dir.lengthSq() < 1e-6) dir.copy(fallback);
    if (dir.lengthSq() < 1e-6) dir.set(1, 0, 0);
    dir.normalize();
    return from.clone().addScaledVector(dir, lengthValue);
  }

  function addSpace3dExampleLine(group, from, to, opacity) {
    const geometry = new THREE.BufferGeometry().setFromPoints([from, to]);
    const material = new THREE.LineBasicMaterial({
      color: 0x333333,
      transparent: opacity < 1,
      opacity,
      depthTest: false
    });
    const line = new THREE.Line(geometry, material);
    line.renderOrder = 30;
    group.add(line);
    return line;
  }

  function addSpace3dExampleEllipse(group, center, uDir, vDir, rx, ry, opacity) {
    const u = uDir.clone();
    const v = vDir.clone();
    if (u.lengthSq() < 1e-6) u.set(1, 0, 0);
    if (v.lengthSq() < 1e-6) v.set(0, 0, 1);
    u.normalize();
    v.normalize();
    const vertices = [center.clone()];
    const segments = 36;
    for (let i = 0; i <= segments; i++) {
      const t = Math.PI * 2 * i / segments;
      vertices.push(center.clone().addScaledVector(u, Math.cos(t) * rx).addScaledVector(v, Math.sin(t) * ry));
    }
    const positions = vertices.flatMap(p => [p.x, p.y, p.z]);
    const indices = [];
    for (let i = 1; i < vertices.length - 1; i++) indices.push(0, i, i + 1);
    const geometry = new THREE.BufferGeometry();
    geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    geometry.setIndex(indices);
    const material = new THREE.MeshBasicMaterial({
      color: 0xffd4df,
      transparent: opacity < 1,
      opacity,
      side: THREE.DoubleSide,
      depthTest: false,
      depthWrite: false
    });
    const mesh = new THREE.Mesh(geometry, material);
    mesh.renderOrder = 30;
    group.add(mesh);
    addSpace3dExampleEllipseOutline(group, center, u, v, rx, ry, opacity);
    return mesh;
  }

  function addSpace3dExampleEllipseOutline(group, center, u, v, rx, ry, opacity) {
    const points = [];
    const segments = 48;
    for (let i = 0; i <= segments; i++) {
      const t = Math.PI * 2 * i / segments;
      points.push(center.clone().addScaledVector(u, Math.cos(t) * rx).addScaledVector(v, Math.sin(t) * ry));
    }
    const geometry = new THREE.BufferGeometry().setFromPoints(points);
    const material = new THREE.LineBasicMaterial({
      color: 0x333333,
      transparent: opacity < 1,
      opacity,
      depthTest: false
    });
    const line = new THREE.Line(geometry, material);
    line.renderOrder = 30;
    group.add(line);
  }

  function addSpace3dExampleDisc(group, center, radius, opacity) {

  function addSpace3dExampleEye(group, center, radius, opacity) {

  function addSpace3dExampleNose(group, center, direction, baseDir, size, opacity) {
    const dir = direction.clone();
    if (dir.lengthSq() < 1e-6) dir.set(0, 1, 0);
    dir.normalize();
    const base = baseDir.clone();
    if (base.lengthSq() < 1e-6) base.set(1, 0, 0);
    base.normalize();
    const p1 = center.clone().addScaledVector(base, size * 0.45);
    const p2 = center.clone().addScaledVector(base, -size * 0.45);
    const tip = center.clone().addScaledVector(dir, size * 1.35);
    const geometry = new THREE.BufferGeometry();
    geometry.setAttribute('position', new THREE.Float32BufferAttribute([
      p1.x, p1.y, p1.z,
      tip.x, tip.y, tip.z,
      p2.x, p2.y, p2.z
    ], 3));
    geometry.setIndex([0, 1, 2]);
    const material = new THREE.MeshBasicMaterial({
      color: 0xffd4df,
      transparent: opacity < 1,
      opacity,
      side: THREE.DoubleSide,
      depthTest: false,
      depthWrite: false
    });
    const mesh = new THREE.Mesh(geometry, material);
    mesh.renderOrder = 30;
    group.add(mesh);
    addSpace3dExampleLine(group, p1, tip, opacity);
    addSpace3dExampleLine(group, tip, p2, opacity);
    addSpace3dExampleLine(group, p2, p1, opacity);
  }

  function buildSpace3dModel(points, transform = null, mapped = null, p0 = null, pictureFrame = null) {
    if (points.cube && mapped && p0 && pictureFrame) {
      return buildSpace3dModelFromProjection(points, transform, mapped, p0, pictureFrame);
    }

    const side = Math.max(24, Math.hypot(points.a.x - points.A.x, points.a.y - points.A.y));
    const origin = mapToSpace3d(points.a, transform);
    const axisX = transform && transform.axisX ? transform.axisX.clone().normalize() : new THREE.Vector3(1, 0, 0);
    const axisY = transform && transform.axisY ? transform.axisY.clone().normalize() : new THREE.Vector3(0, -1, 0);
    const upDir = transform && transform.normal ? transform.normal.clone().normalize() : new THREE.Vector3(0, 0, -1);
    const leftDir = axisX.clone().multiplyScalar(-1);
    const rightDir = axisY.clone().multiplyScalar(-1);
    const roofUp = upDir.clone().multiplyScalar(side * Math.tan(Math.max(1, Math.min(80, FRONT2D_STATE.roofDeltaDeg)) * Math.PI / 180));
    const a = origin.clone();
    const b = a.clone().addScaledVector(leftDir, side);
    const c = a.clone().addScaledVector(rightDir, side);
    const d = b.clone().addScaledVector(rightDir, side);
    const A = a.clone().addScaledVector(upDir, side);
    const B = b.clone().addScaledVector(upDir, side);
    const C = c.clone().addScaledVector(upDir, side);
    const D = d.clone().addScaledVector(upDir, side);
    const E = B.clone().add(roofUp);
    const F = D.clone().add(roofUp);
    const vertices = { a, b, c, d, A, B, C, D, E, F };
    applySpace3dHeightOffset(vertices, upDir);
    const groundNormal = upDir.clone();
    return {
      vertices,
      groundNormal,
      upDir,
      groundPlane: { point: a.clone(), normal: groundNormal.clone() }
    };
  }

  function buildSpace3dModelFromProjection(points, transform, mapped, p0, pictureFrame) {
    const cube2d = points.cube || {};
    const footprint2d = points.baseCube || cube2d;
    const roof2d = points.baseRoof || points.roof || {};
    const basis = space3dPerspectiveBasis(points, transform, mapped, p0, pictureFrame);
    const projectGround = (point2d) => space3dProjectImagePointToGround(point2d, p0, basis, transform);
    const projectVertical = (point2d, basePoint) => space3dProjectImagePointToVertical(point2d, basePoint, p0, basis, transform);

    const a = projectGround(footprint2d.a || cube2d.a || points.a);
    const b = projectGround(footprint2d.b || cube2d.b || points.a);
    const c = projectGround(footprint2d.c || cube2d.c || points.a);
    const d = projectGround(footprint2d.d || cube2d.d || points.a);
    const A = projectVertical(footprint2d.A || cube2d.A || points.A, a);
    const B = projectVertical(footprint2d.B || cube2d.B || points.A, b);
    const C = projectVertical(footprint2d.C || cube2d.C || points.A, c);
    const D = projectVertical(footprint2d.D || cube2d.D || points.A, d);
    const E = roof2d.E ? projectVertical(roof2d.E, b) : B.clone();
    const F = roof2d.F ? projectVertical(roof2d.F, d) : D.clone();

    let upDir = new THREE.Vector3().subVectors(A, a);
    if (upDir.lengthSq() < 1e-6) upDir.copy(basis.verticalDir).multiplyScalar(-1);
    upDir.normalize();
    const minRise = Math.max(2, Math.abs(new THREE.Vector3().subVectors(A, a).dot(upDir)) * 0.08, 6);
    const ensureAbove = (top, base) => {
      const rise = new THREE.Vector3().subVectors(top, base).dot(upDir);
      if (!Number.isFinite(rise) || rise < minRise) top.copy(base).addScaledVector(upDir, minRise);
    };
    ensureAbove(A, a);
    ensureAbove(B, b);
    ensureAbove(C, c);
    ensureAbove(D, d);
    ensureAbove(E, B);
    ensureAbove(F, D);

    const vertices = { a, b, c, d, A, B, C, D, E, F };
    applySpace3dHeightOffset(vertices, upDir);
    return {
      vertices,
      groundNormal: basis.groundNormal.clone(),
      upDir,
      verticalDir: basis.verticalDir.clone(),
      groundPlane: {
        point: basis.groundPlane.point.clone(),
        normal: basis.groundPlane.normal.clone()
      }
    };
  }

  function applySpace3dHeightOffset(vertices, upDir = null) {
    const heightUnits = clampNumeric(Number(FRONT2D_STATE.heightUnits), 0, 5);
    if (!heightUnits || !vertices || !vertices.a || !vertices.A) return;
    const dir = upDir && upDir.lengthSq() > 1e-6
      ? upDir.clone().normalize()
      : new THREE.Vector3().subVectors(vertices.A, vertices.a).normalize();
    if (dir.lengthSq() < 1e-6) return;
    const unitHeight = Math.max(2, Math.abs(new THREE.Vector3().subVectors(vertices.A, vertices.a).dot(dir)));
    const offset = unitHeight * heightUnits;
    for (const vertex of Object.values(vertices)) {
      vertex.addScaledVector(dir, offset);
    }
  }

  function space3dPerspectiveBasis(points, transform, mapped, p0, pictureFrame) {
    const vp1Dir = directionFromTo(p0, mapped.VP1 || mapped.VPL);
    const vp2Dir = directionFromTo(p0, mapped.VP2 || mapped.VPR);
    const verticalDir = directionFromTo(p0, mapped.VP3);
    let groundNormal = new THREE.Vector3().crossVectors(vp1Dir, vp2Dir);
    if (groundNormal.lengthSq() < 1e-9) groundNormal.copy(verticalDir);
    groundNormal.normalize();
    if (groundNormal.dot(verticalDir) < 0) groundNormal.multiplyScalar(-1);

    const anchor2d = points.baseA || (points.baseCube && points.baseCube.a) || points.a || (points.cube && points.cube.a);
    const anchorOnPicture = anchor2d ? mapToSpace3d(anchor2d, transform) : (mapped.a || mapped.O || pictureFrame.center);
    const center = mapped.O || pictureFrame.center;
    let sideSign = -1;
    if (anchorOnPicture && center && pictureFrame && pictureFrame.up) {
      const side = new THREE.Vector3().subVectors(anchorOnPicture, center).dot(pictureFrame.up);
      if (Math.abs(side) > 1e-6) sideSign = Math.sign(side);
    }
    const half = Math.max(1, (pictureFrame.height || pictureFrame.size || 1) / 2);
    const groundPoint = pictureFrame.center.clone().addScaledVector(pictureFrame.up, sideSign * half);
    return {
      vp1Dir,
      vp2Dir,
      verticalDir,
      groundNormal,
      groundPlane: {
        point: groundPoint,
        normal: groundNormal.clone()
      }
    };
  }

  function space3dRayPlaneIntersection(origin, direction, planePoint, planeNormal) {
    const dir = direction.clone();
    if (dir.lengthSq() < 1e-9) dir.set(0, 1, 0);
    dir.normalize();
    const normal = planeNormal.clone();
    if (normal.lengthSq() < 1e-9) normal.set(0, 0, 1);
    normal.normalize();
    const denom = dir.dot(normal);
    if (Math.abs(denom) < 1e-8) return null;
    const t = new THREE.Vector3().subVectors(planePoint, origin).dot(normal) / denom;
    if (!Number.isFinite(t)) return null;
    return origin.clone().addScaledVector(dir, t);
  }

  function space3dProjectImagePointToGround(point2d, p0, basis, transform) {
    const imagePoint = mapToSpace3d(point2d, transform);
    const direction = new THREE.Vector3().subVectors(imagePoint, p0);
    const projected = space3dRayPlaneIntersection(p0, direction, basis.groundPlane.point, basis.groundPlane.normal);
    if (projected) return projected;
    return imagePoint.clone();
  }

  function space3dProjectImagePointToVertical(point2d, basePoint, p0, basis, transform) {
    const imagePoint = mapToSpace3d(point2d, transform);
    const rayDir = new THREE.Vector3().subVectors(imagePoint, p0);
    if (rayDir.lengthSq() < 1e-9) return basePoint.clone();
    rayDir.normalize();
    const lineDir = basis.verticalDir.clone();
    if (lineDir.lengthSq() < 1e-9) lineDir.copy(basis.groundNormal);
    lineDir.normalize();
    const w0 = new THREE.Vector3().subVectors(p0, basePoint);
    const a = 1;
    const b = rayDir.dot(lineDir);
    const c = 1;
    const d = rayDir.dot(w0);
    const e = lineDir.dot(w0);
    const denom = a * c - b * b;
    if (Math.abs(denom) < 1e-8) {
      return basePoint.clone().addScaledVector(lineDir, 80);
    }
    const t = (b * e - c * d) / denom;
    const s = (a * e - b * d) / denom;
    const onRay = p0.clone().addScaledVector(rayDir, t);
    const onLine = basePoint.clone().addScaledVector(lineDir, s);
    if (!isFiniteVector3(onRay) || !isFiniteVector3(onLine)) return basePoint.clone();
    // 模型点必须严格落在过底点的真实竖直线上；onRay 只用于数值校验。
    return onLine;
  }

  function isFiniteVector3(vector) {
    return vector && Number.isFinite(vector.x) && Number.isFinite(vector.y) && Number.isFinite(vector.z);
  }

  function signedVanishingDirection(eye, vanishingPoint, fromPoint, expectedPoint) {
    const dir = directionFromTo(eye, vanishingPoint);
    const expected = new THREE.Vector3().subVectors(expectedPoint, fromPoint);
    if (expected.dot(dir) < 0) dir.multiplyScalar(-1);
    return dir;
  }

  function directionFromTo(from, to) {
    const dir = new THREE.Vector3().subVectors(to, from);
    if (dir.lengthSq() < 1e-9) dir.set(1, 0, 0);
    return dir.normalize();
  }

  function pointBeyondPicture(eye, picturePoint, scale) {
    return eye.clone().add(new THREE.Vector3().subVectors(picturePoint, eye).multiplyScalar(scale));
  }

  function pointOnVanishingLineThroughProjection(lineOrigin, vanishDir, eye, picturePoint) {
    const rayDir = directionFromTo(eye, picturePoint);
    const w0 = new THREE.Vector3().subVectors(lineOrigin, eye);
    const b = vanishDir.dot(rayDir);
    const d = vanishDir.dot(w0);
    const e = rayDir.dot(w0);
    const denom = 1 - b * b;
    if (Math.abs(denom) < 1e-7) {
      return pointBeyondPicture(eye, picturePoint, 1.62);
    }
    const lineT = (b * e - d) / denom;
    const rayT = (e - b * d) / denom;
    const onLine = lineOrigin.clone().addScaledVector(vanishDir, lineT);
    const onRay = eye.clone().addScaledVector(rayDir, rayT);
    return averageVector(onLine, onRay);
  }

  function averageVector(a, b) {
    return a.clone().add(b).multiplyScalar(0.5);
  }

  function depthRatioFromProjection(eye, picturePoint, spacePoint) {
    const pictureDistance = Math.max(1e-6, eye.distanceTo(picturePoint));
    return Math.max(1.05, eye.distanceTo(spacePoint) / pictureDistance);
  }

  function angleAt2d(vertex, rayA, rayB) {
    const v1x = rayA.x - vertex.x;
    const v1y = rayA.y - vertex.y;
    const v2x = rayB.x - vertex.x;
    const v2y = rayB.y - vertex.y;
    const dot = v1x * v2x + v1y * v2y;
    const len1 = Math.hypot(v1x, v1y);
    const len2 = Math.hypot(v2x, v2y);
    const ratio = dot / Math.max(1e-9, len1 * len2);
    return Math.acos(Math.max(-1, Math.min(1, ratio))) * 180 / Math.PI;
  }

  function addSpace3dModel(group, model) {
    const v = model.vertices;
    addSpace3dFace(group, [v.a, v.b, v.d, v.c], '#eef1f4', 0.42);
    addSpace3dFace(group, [v.a, v.A, v.B, v.b], '#f7f8fa', 0.5);
    addSpace3dFace(group, [v.a, v.c, v.C, v.A], '#f7f8fa', 0.46);
    addSpace3dFace(group, [v.b, v.B, v.D, v.d], '#e9edf1', 0.36);
    addSpace3dFace(group, [v.c, v.d, v.D, v.C], '#e9edf1', 0.34);
    const edges = [
      ['a', 'b'], ['b', 'd'], ['d', 'c'], ['c', 'a'],
      ['a', 'A'], ['b', 'B'], ['c', 'C'], ['d', 'D'],
      ['A', 'B'], ['B', 'D'], ['D', 'C'], ['C', 'A']
    ];
    for (const [from, to] of edges) {
      addSpace3dLine(group, v[from], v[to], SVG_COLORS.black, 1.7);
    }
    for (const name of ['a', 'b', 'c', 'd', 'A', 'B', 'C', 'D']) {
      addSpace3dPoint(group, v[name], SVG_COLORS.black, name);
    }
    for (const name of ['a', 'b', 'c', 'd', 'A', 'B', 'C', 'D']) {
      addSpace3dLabel(name, v[name], SVG_COLORS.black);
    }
  }

  function addSpace3dConstructionRays(group, mapped, model, p0) {
    const v = model.vertices;
    const vp1Dir = new THREE.Vector3().subVectors(mapped.VP1, p0);
    const vp2Dir = new THREE.Vector3().subVectors(mapped.VP2, p0);
    const vp3Dir = new THREE.Vector3().subVectors(mapped.VP3, p0);
    addSpace3dRay(group, mapped['P(Q2)'], new THREE.Vector3().subVectors(mapped['P(Q2)'], p0), SVG_COLORS.half, 0.22, 0.56);
    addSpace3dRay(group, mapped['P(Q1)'], new THREE.Vector3().subVectors(mapped['P(Q1)'], p0), SVG_COLORS.half, 0.22, 0.56);
    addSpace3dRay(group, v.a, vp1Dir, SVG_COLORS.pink, 0.18, 0.5);
    addSpace3dRay(group, v.A, vp1Dir, SVG_COLORS.pink, 0.18, 0.5);
    addSpace3dRay(group, v.b, vp2Dir, SVG_COLORS.pink, 0.18, 0.5);
    addSpace3dRay(group, v.c, vp1Dir, SVG_COLORS.pink, 0.18, 0.5);
    addSpace3dRay(group, v.d, vp1Dir, SVG_COLORS.pink, 0.18, 0.5);
    addSpace3dRay(group, v.d, vp2Dir, SVG_COLORS.pink, 0.18, 0.5);
    for (const name of ['a', 'A', 'b', 'B', 'c', 'C', 'd', 'D']) {
      addSpace3dRay(group, v[name], vp3Dir, SVG_COLORS.pink, 0.16, 0.42);
    }
  }

  function addSpace3dVanishingOriginLabels(group, mapped, model, p0) {
    const v = model.vertices;
    const labels = [
      ['VP1⁰', p0, new THREE.Vector3().subVectors(mapped.VP1, p0), SVG_COLORS.blue],
      ['VP2⁰', p0, new THREE.Vector3().subVectors(mapped.VP2, p0), SVG_COLORS.yellow],
      ['VP3⁰', p0, new THREE.Vector3().subVectors(mapped.VP3, p0), SVG_COLORS.pink],
      ['P(Q2)⁰', mapped['P(Q2)'], new THREE.Vector3().subVectors(mapped['P(Q2)'], p0), SVG_COLORS.half],
      ['P(Q1)⁰', mapped['P(Q1)'], new THREE.Vector3().subVectors(mapped['P(Q1)'], p0), SVG_COLORS.half]
    ];
    for (const [textValue, origin, direction, color] of labels) {
      addSpace3dLabel(textValue, space3dRayEndPoint(origin, direction), color);
    }
  }

  function addSpace3dFace(group, vertices, color, opacity, selectName = '') {
    const positions = [];
    for (const vertex of vertices) positions.push(vertex.x, vertex.y, vertex.z);
    const indices = [];
    for (let i = 1; i < vertices.length - 1; i++) indices.push(0, i, i + 1);
    const geometry = new THREE.BufferGeometry();
    geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    geometry.setIndex(indices);
    geometry.computeVertexNormals();
    const material = new THREE.MeshBasicMaterial({
      color: toThreeColor(color),
      transparent: true,
      opacity,
      side: THREE.DoubleSide,
      depthWrite: false
    });
    const mesh = new THREE.Mesh(geometry, material);
    if (selectName) {
      makeSpace3dSelectable(mesh, 'face', selectName);
      if (isSpace3dSelected('face', selectName)) {
        material.color.setHex(0xffe34d);
        material.opacity = Math.max(opacity, 0.55);
        addSpace3dFaceGlow(group, vertices);
      }
    }
    group.add(mesh);
    return mesh;
  }

  function addSpace3dFaceGlow(group, vertices) {
    const positions = [];
    for (const vertex of vertices) positions.push(vertex.x, vertex.y, vertex.z);
    const indices = [];
    for (let i = 1; i < vertices.length - 1; i++) indices.push(0, i, i + 1);
    const geometry = new THREE.BufferGeometry();
    geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    geometry.setIndex(indices);
    const material = new THREE.MeshBasicMaterial({
      color: 0xffe34d,
      transparent: true,
      opacity: 0.28,
      side: THREE.DoubleSide,
      depthWrite: false
    });
    group.add(new THREE.Mesh(geometry, material));
  }

  function addSpace3dFaceLabel(group, value, vertices, color) {
    const left = vertices[0];
    const right = vertices[1];
    const top = vertices[2];
    const center = left.clone().multiplyScalar(0.46)
      .add(right.clone().multiplyScalar(0.16))
      .add(top.clone().multiplyScalar(0.38));
    addSpace3dLabel(value, center, color, 'space-face-label');
  }

  function addSpace3dAngle(group, value, vertex, rayA, rayB, color, radius, selectName = '') {
    const v1 = new THREE.Vector3().subVectors(rayA, vertex);
    const v2 = new THREE.Vector3().subVectors(rayB, vertex);
    if (v1.lengthSq() < 1e-6 || v2.lengthSq() < 1e-6) return;
    v1.normalize();
    v2.normalize();

    const normal = new THREE.Vector3().crossVectors(v1, v2);
    if (normal.lengthSq() < 1e-6) return;
    normal.normalize();

    const angle = Math.acos(Math.max(-1, Math.min(1, v1.dot(v2))));
    const arcPoints = [];
    const segments = 32;
    for (let i = 0; i <= segments; i++) {
      const dir = v1.clone().applyAxisAngle(normal, angle * i / segments);
      arcPoints.push(vertex.clone().addScaledVector(dir, radius));
    }
    const geometry = new THREE.BufferGeometry().setFromPoints(arcPoints);
    const material = new THREE.LineBasicMaterial({ color: toThreeColor(color), linewidth: 1.4 });
    const arc = new THREE.Line(geometry, material);
    if (selectName) makeSpace3dSelectable(arc, 'line', selectName);
    group.add(arc);
    if (selectName && isSpace3dSelected('line', selectName)) {
      const outlineGeometry = new THREE.BufferGeometry().setFromPoints(arcPoints);
      const outlineMaterial = new THREE.LineBasicMaterial({ color: 0xffe34d, linewidth: 2.4, transparent: true, opacity: 0.95 });
      group.add(new THREE.Line(outlineGeometry, outlineMaterial));
    }

    const midDir = v1.clone().applyAxisAngle(normal, angle * 0.5).normalize();
    const labelCenter = vertex.clone().addScaledVector(midDir, radius + 3);
    addSpace3dLabel(value, labelCenter, color, 'space-angle-label');
  }

  function addSpace3dTextPlane(group, value, center, uDir, vDir, width, height, color, opacity) {
    const canvas = document.createElement('canvas');
    canvas.width = 256;
    canvas.height = 96;
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = color;
    ctx.font = '700 40px Arial, "Microsoft YaHei", sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(value, canvas.width / 2, canvas.height / 2);

    const texture = new THREE.CanvasTexture(canvas);
    texture.needsUpdate = true;

    const u = uDir.clone().normalize().multiplyScalar(width / 2);
    const v = vDir.clone().normalize().multiplyScalar(height / 2);
    const corners = [
      center.clone().sub(u).sub(v),
      center.clone().add(u).sub(v),
      center.clone().add(u).add(v),
      center.clone().sub(u).add(v)
    ];
    const geometry = new THREE.BufferGeometry();
    geometry.setAttribute('position', new THREE.Float32BufferAttribute(corners.flatMap(p => [p.x, p.y, p.z]), 3));
    geometry.setAttribute('uv', new THREE.Float32BufferAttribute([0, 1, 1, 1, 1, 0, 0, 0], 2));
    geometry.setIndex([0, 1, 2, 0, 2, 3]);

    const material = new THREE.MeshBasicMaterial({
      map: texture,
      transparent: true,
      opacity,
      side: THREE.DoubleSide,
      depthWrite: false
    });
    group.add(new THREE.Mesh(geometry, material));
  }

  function addSpace3dLine(group, from, to, color, width, opacity = 1) {
    const geometry = new THREE.BufferGeometry().setFromPoints([from, to]);
    const material = new THREE.LineBasicMaterial({
      color: toThreeColor(color),
      linewidth: width,
      transparent: opacity < 1,
      opacity
    });
    const line = new THREE.Line(geometry, material);
    group.add(line);
    return line;
  }

  function addSpace3dSelectableLine(group, from, to, color, width, selectName, opacity = 1) {
    const line = addSpace3dLine(group, from, to, color, width, opacity);
    makeSpace3dSelectable(line, 'line', selectName);
    if (isSpace3dSelected('line', selectName)) {
      addSpace3dLine(group, from, to, '#ffe34d', 1.6, 0.95);
    }
    return line;
  }

  function addSpace3dInfiniteLine(group, p1, p2, selectName) {
    const endpoints = space3dLongLineEndpoints(p1, p2);
    return addSpace3dSelectableLine(group, endpoints.start, endpoints.end, '#d7dde3', 0.25, selectName, 0.42);
  }

  function addSpace3dInfiniteGuideLine(group, p1, p2) {
    const endpoints = space3dLongLineEndpoints(p1, p2);
    return addSpace3dLine(group, endpoints.start, endpoints.end, '#d7dde3', 0.25, 0.42);
  }

  function addSpace3dRay(group, origin, direction, color, width, opacity = 1) {
    const end = space3dRayEndPoint(origin, direction);
    return addSpace3dLine(group, origin, end, color, width, opacity);
  }

  function space3dRayEndPoint(origin, direction) {
    const dir = direction.clone();
    if (dir.lengthSq() < 1e-6) dir.set(1, 0, 0);
    dir.normalize();
    return origin.clone().addScaledVector(dir, 25000);
  }

  function space3dLongLineEndpoints(p1, p2) {
    const dir = new THREE.Vector3().subVectors(p2, p1);
    if (dir.lengthSq() < 1e-6) dir.set(1, 0, 0);
    dir.normalize();
    const center = new THREE.Vector3().addVectors(p1, p2).multiplyScalar(0.5);
    const halfLength = 25000;
    return {
      start: center.clone().addScaledVector(dir, -halfLength),
      end: center.clone().addScaledVector(dir, halfLength)
    };
  }

  function addSpace3dFrame(group, frame, color, width) {
    const corners = frame.corners;
    for (let i = 0; i < corners.length; i++) {
      addSpace3dLine(group, corners[i], corners[(i + 1) % corners.length], color, width);
    }
  }

  function addSpace3dPoint(group, position, color, selectName = '') {
    const geometry = new THREE.SphereGeometry(SPACE3D_POINT_RADIUS, 16, 10);
    const material = new THREE.MeshBasicMaterial({ color: toThreeColor(color) });
    const mesh = new THREE.Mesh(geometry, material);
    mesh.position.copy(position);
    if (selectName) makeSpace3dSelectable(mesh, 'symbol', selectName);
    group.add(mesh);
    if (selectName && isSpace3dSelected('symbol', selectName)) {
      const outlineGeometry = new THREE.SphereGeometry(SPACE3D_POINT_RADIUS + 1.7, 18, 12);
      const outlineMaterial = new THREE.MeshBasicMaterial({
        color: 0xffe34d,
        wireframe: true,
        transparent: true,
        opacity: 0.95
      });
      const outline = new THREE.Mesh(outlineGeometry, outlineMaterial);
      outline.position.copy(position);
      group.add(outline);
    }
    return mesh;
  }

  function makeSpace3dSelectable(object, type, name) {
    object.userData.selectable = true;
    object.userData.selectType = type;
    object.userData.selectName = name;
  }

  function isSpace3dSelected(type, name) {
    return Boolean(space3dSelection && space3dSelection.type === type && space3dSelection.name === name);
  }

  function handleSpace3dPick(event) {
    if (!space3d) return;
    const { canvas, camera, raycaster, pointer, dynamicGroup } = space3d;
    const rect = canvas.getBoundingClientRect();
    pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
    pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
    raycaster.setFromCamera(pointer, camera);

    const hits = raycaster.intersectObjects(dynamicGroup.children, true);
    let selected = null;
    let fallbackLine = null;
    let fallbackPicture = null;
    for (const hit of hits) {
      const target = selectableSpace3dObject(hit.object);
      if (target) {
        const candidate = {
          type: target.userData.selectType,
          name: target.userData.selectName
        };
        if (candidate.name === '画面') {
          if (!fallbackPicture) fallbackPicture = candidate;
          continue;
        }
        if (candidate.type === 'line') {
          if (!fallbackLine) fallbackLine = candidate;
          continue;
        }
        selected = candidate;
        break;
      }
    }
    if (!selected) selected = fallbackLine;
    if (!selected) selected = fallbackPicture;

    space3dSelection = selected;
    showSpace3dSelectionInfo();
    if (lastSpace3dPayload) updateSpace3d(lastSpace3dPayload);
  }

  function selectableSpace3dObject(object) {
    let current = object;
    while (current) {
      if (current.userData && current.userData.selectable) return current;
      current = current.parent;
    }
    return null;
  }

  function showSpace3dSelectionInfo() {
    const box = document.getElementById('spaceSelectInfo');
    if (!box) return;
    box.innerHTML = space3dSelection ? symbolInfoHtml(space3dSelection.name) : '';
  }

  function addSpace3dLabel(textValue, position, color, extraClass = '') {
    if (!SPACE3D_STATE.showLabels) return null;
    const el = document.createElement('div');
    el.className = extraClass ? `space-label ${extraClass}` : 'space-label';
    el.textContent = displaySymbol(textValue);
    el.style.color = color;
    space3d.labelLayer.appendChild(el);
    space3dLabels.push({ el, position: position.clone() });
  }

  function updateSpace3dLabels() {
    if (!space3d) return;
    const { canvas, camera } = space3d;
    const rect = canvas.getBoundingClientRect();
    const projected = new THREE.Vector3();
    for (const item of space3dLabels) {
      projected.copy(item.position).project(camera);
      const x = (projected.x * 0.5 + 0.5) * rect.width;
      const y = (-projected.y * 0.5 + 0.5) * rect.height;
      const visible = projected.z > -1 && projected.z < 1;
      item.el.style.display = visible ? 'block' : 'none';
      item.el.style.left = `${x}px`;
      item.el.style.top = `${y}px`;
    }
  }

  function disposeSpace3dObject(object) {
    if (object.geometry) object.geometry.dispose();
    if (object.material) {
      if (object.material.map) object.material.map.dispose();
      object.material.dispose();
    }
  }

  function toThreeColor(color) {
    return Number.parseInt(color.replace('#', ''), 16);
  }

  function space3dColorFor(name) {
    if (name === 'CV' || name === 'P' || name === 'P1' || name === 'P2' || name === 'O' || name === 'Pθ') return SVG_COLORS.green;
    if (name === 'VP1' || name === "VP1'" || name === 'VPL' || name === 'S1') return SVG_COLORS.blue;
    if (name === 'VP2' || name === "VP2'" || name === 'VPR') return SVG_COLORS.yellow;
    if (name === 'VP3') return SVG_COLORS.pink;
    if (name === 'P(Q1)' || name === 'P(Q2)' || name === "A'" || name === "A''") return SVG_COLORS.half;
    return SVG_COLORS.black;
  }

  function clampNumeric(value, min, max) {
    const numeric = Number(value);
    if (!Number.isFinite(numeric)) return min;
    return Math.max(min, Math.min(max, numeric));
  }

  function stepDecimals(step) {
    const text = String(step);
    if (text.includes('e-')) return Math.max(0, Number(text.split('e-')[1]) || 0);
    const dot = text.indexOf('.');
    return dot >= 0 ? Math.min(8, text.length - dot - 1) : 0;
  }

  function setupFrontControls() {
    const resetBtn = document.getElementById('frontResetBtn');
    const labelToggleBtn = document.getElementById('frontLabelToggleBtn');
    const auxToggleBtn = document.getElementById('frontAuxToggleBtn');
    const exampleToggleBtn = document.getElementById('frontExampleToggleBtn');

    const cvRangeToggle = document.getElementById('frontCvRangeToggle');

      Object.assign(FRONT2D_STATE, DEFAULT_FRONT2D_STATE);

      FRONT2D_STATE.showLabels = !FRONT2D_STATE.showLabels;

      drawFront2d();

      FRONT2D_STATE.showAux = !FRONT2D_STATE.showAux;
      syncFrontControls();
      drawFront2d();
    });

      FRONT2D_STATE.showExamples = !FRONT2D_STATE.showExamples;
      syncFrontControls();
      drawFront2d();
    });
