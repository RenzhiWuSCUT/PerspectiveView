      FRONT2D_STATE.fovDeg = Number(fovSlider.value);
      syncFrontControls();
      drawFront2d();
    });

    thetaSlider.addEventListener('input', () => {
      FRONT2D_STATE.thetaDeg = Number(thetaSlider.value);

      drawFront2d();
    });

    sliderStepBtns.forEach((btn) => {
      btn.addEventListener('click', () => {
        const slider = document.getElementById(btn.dataset.target);
        if (!slider) return;
        const step = Math.abs(Number(slider.step)) || 1;
        const delta = Number(btn.dataset.delta) || 0;
        const min = Number.isFinite(Number(slider.min)) ? Number(slider.min) : -Infinity;
        const max = Number.isFinite(Number(slider.max)) ? Number(slider.max) : Infinity;
        const current = Number(slider.value) || 0;
        const decimals = stepDecimals(step);
        const next = Math.max(min, Math.min(max, current + delta * step));
        slider.value = String(Number(next.toFixed(decimals)));
        slider.dispatchEvent(new Event('input', { bubbles: true }));
      });
    });

    syncFrontControls();
  }

  function rotateFrontPointAround(point, pivot, angleDeg) {
    if (!point || !pivot || !Number.isFinite(point.x) || !Number.isFinite(point.y)) return point;
    const angle = (Number(angleDeg) || 0) * Math.PI / 180;
    if (Math.abs(angle) < 1e-12) return { ...point };
    const cos = Math.cos(angle);
    const sin = Math.sin(angle);
    const dx = point.x - pivot.x;
    const dy = point.y - pivot.y;
    return {
      ...point,
      x: pivot.x + dx * cos - dy * sin,
      y: pivot.y + dx * sin + dy * cos
    };
  }

  function rotateFrontValueAround(value, pivot, angleDeg) {
    if (!value || !pivot || !Number.isFinite(Number(angleDeg)) || Math.abs(Number(angleDeg)) < 1e-12) return value;
    if (Array.isArray(value)) return value.map(item => rotateFrontValueAround(item, pivot, angleDeg));
    if (typeof value !== 'object') return value;
    if (Number.isFinite(value.x) && Number.isFinite(value.y)) return rotateFrontPointAround(value, pivot, angleDeg);
    const result = {};
    for (const [key, child] of Object.entries(value)) {
      result[key] = rotateFrontValueAround(child, pivot, angleDeg);
    }
    return result;
  }

  function rotateFrontPayloadAround(payload, pivot, angleDeg) {
    if (!payload || !pivot || !Number.isFinite(Number(angleDeg)) || Math.abs(Number(angleDeg)) < 1e-12) return payload;
    return rotateFrontValueAround(payload, pivot, angleDeg);
  }

  function drawFront2d() {
    const svg = document.getElementById('front2d');
    const NS = 'http://www.w3.org/2000/svg';

    const observerGap = Math.max(MIN_P_CV_DISTANCE, FRONT2D_STATE.pY - FRONT2D_STATE.horizonY);
    const canvasCenter = frontCanvasCenter(svg);
    // 画面的真正中心固定为 CV；O 只作为视高面/地平线在画面上的交线位置。
    FRONT2D_STATE.cvX = canvasCenter.x;
    FRONT2D_STATE.horizonY = canvasCenter.y;
    FRONT2D_STATE.pY = canvasCenter.y + observerGap;
    FRONT2D_STATE.p2Distance = Math.max(
      MIN_P_CV_DISTANCE,
      Number.isFinite(FRONT2D_STATE.p2Distance) ? FRONT2D_STATE.p2Distance : observerGap
    );

    const cv = pt(canvasCenter.x, canvasCenter.y);
    let baseA = pt(FRONT2D_STATE.aX, FRONT2D_STATE.aY);
    const planObserver = pt(canvasCenter.x, canvasCenter.y + observerGap);
    let third = threePointGeometry(cv, observerGap);
    const horizonRotateDeg = clampNumeric(Number(FRONT2D_STATE.horizonRotateDeg), -180, 180);
    FRONT2D_STATE.horizonRotateDeg = horizonRotateDeg;
    baseA = clampAnchorAwayFromHorizon(baseA, third, anchorSideSignForThird(third, baseA));
    const observer = third.pTheta;
    let rotationAngle = FRONT2D_STATE.vprAngleDeg;
    let baseGeom = geometryFromRotationAngle(baseA, rotationAngle, cv, planObserver, third);
    if (!baseGeom) {
      if (lastFront2dPayload) updateSpace3d(lastFront2dPayload);

    }
    const heightUnits = clampNumeric(Number(FRONT2D_STATE.heightUnits), 0, 5);
    const baseSideLength = clamp(baseGeom.projectedSideLength, 8, 320);
    const lockedAnchorSide = anchorSideSignForThird(third, baseA);
    let a = elevatedAnchorFromBase(baseA, third, baseSideLength, heightUnits);
    // 注意：这里不能再 clamp 显示出来的 a。
    // 拖拽限制应作用在“a 减去高度后的地面基准 baseA”上；高度滑条本身允许把显示 a 推过 VP1-VP2。
    let geom = geometryFromRotationAngle(a, rotationAngle, cv, planObserver, third, baseSideLength, {
      allowHorizonCrossing: true,

    });

    // 同一次 D 拖拽中，所有候选角度都用这个固定长度计算，避免 aA 被灭点关系顺手缩放。
    const dDragLockedSideLength = clamp(distance(a, A), 8, 320);
    const q1CvOverlap = false;

    drawRealExamples(frontLayer, { cv, observer, ground, vpl, vpr, q1, q2, e, f, roof, third });

    if (!vpCvOverlap) {

    dragHandle(frontLayer, ground.p2, 13, onP2Drag, 'P2');
    if (FRONT2D_STATE.showAux) {

    point(frontLayer, a, SVG_COLORS.black, 5, 'a');
    point(frontLayer, A, SVG_COLORS.black, 5, 'A');
    point(frontLayer, D, SVG_COLORS.black, 5, 'D');
    if (FRONT2D_STATE.showAux && s && t && y) {
      point(frontLayer, s, SVG_COLORS.orange, 4, 'S');
      point(frontLayer, t, SVG_COLORS.orange, 4, 'T');
      point(frontLayer, y, SVG_COLORS.green, 4, 'Y');
    }

    if (FRONT2D_STATE.showLabels) {
      if (!vpCvOverlap) {
        label(frontLayer, 'VP1', vpl, SVG_COLORS.blue);
        label(frontLayer, 'VP2', vpr, SVG_COLORS.yellow);
      }
      label(frontLayer, 'O', third.o, SVG_COLORS.green);
      label(frontLayer, 'VP3', third.vp3, SVG_COLORS.pink);
      label(frontLayer, vpCvOverlap ? 'CV(VP)' : 'CV', cv, SVG_COLORS.green);
      label(frontLayer, 'P1', observer, SVG_COLORS.green);
      label(frontLayer, 'P2', ground.p2, SVG_COLORS.green);
      if (FRONT2D_STATE.showAux) {

        if (!q2CvOverlap) label(frontLayer, 'P(Q2)', q2, SVG_COLORS.half);
        if (s && t && y) {

          label(frontLayer, 'T', t, SVG_COLORS.orange);

      }
    }

    if (FRONT2D_STATE.showLabels) {
      for (const [name, p] of Object.entries(cube)) {
        label(frontLayer, name, p, SVG_COLORS.black);
      }
      if (s && t && y) {
        drawAngleLabel(frontLayer, 'β', A, s, B, SVG_COLORS.yellow, 24);
        drawAngleLabel(frontLayer, 'α', A, C, t, SVG_COLORS.blue, 24);
      }
      drawAngleLabel(frontLayer, 'θ', third.pTheta, cv, third.o, SVG_COLORS.green, 18);
    }
    dragHandle(frontLayer, a, 13, onADrag, 'a');
    dragHandle(frontLayer, A, 13, onUpperADrag, 'A');
    dragHandle(frontLayer, D, 13, onDDrag, 'D');
    drawCvRangeMask(frontLayer, { cv, observer });

    function pt(x, y) {
      return { x, y };
    }

    function frontCanvasCenter(svgNode) {
      const box = svgNode && svgNode.viewBox && svgNode.viewBox.baseVal;
      if (!box || !Number.isFinite(box.width) || !Number.isFinite(box.height)) {
        return pt(350, 260);
      }
      return pt(box.x + box.width / 2, box.y + box.height / 2);
    }

    function pitchOffsetY(distanceValue) {
      const thetaDeg = clamp(Number.isFinite(FRONT2D_STATE.thetaDeg) ? FRONT2D_STATE.thetaDeg : 35, -89, 89);
      const safeThetaDeg = Math.abs(thetaDeg) < 1 ? (thetaDeg < 0 ? -1 : 1) : thetaDeg;
      return Math.tan(safeThetaDeg * Math.PI / 180) * Math.max(MIN_P_CV_DISTANCE, distanceValue);
    }

    function lerp(p, q, t) {
      return pt(p.x + (q.x - p.x) * t, p.y + (q.y - p.y) * t);
    }

    function distance(p, q) {
      return Math.hypot(p.x - q.x, p.y - q.y);
    }

    function pointsOverlap(p, q, epsilon) {
      return distance(p, q) <= epsilon;
    }

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function anchorSideSignForThird(thirdGeometry, anchorPoint = null) {
      if (thirdGeometry && anchorPoint && Number.isFinite(anchorPoint.y) && thirdGeometry.o && Number.isFinite(thirdGeometry.o.y)) {
        const currentSign = Math.sign(anchorPoint.y - thirdGeometry.o.y);
        if (currentSign !== 0) return currentSign;
      }
      if (thirdGeometry && thirdGeometry.vp3 && thirdGeometry.o) {
        const vp3Side = Math.sign(thirdGeometry.vp3.y - thirdGeometry.o.y);
        if (vp3Side !== 0) return vp3Side;
      }
      return thirdGeometry && thirdGeometry.viewSign ? thirdGeometry.viewSign : 1;
    }

    function clampAnchorAwayFromHorizon(anchorPoint, thirdGeometry, sideSign = null) {
      if (!anchorPoint || !thirdGeometry || !thirdGeometry.o || !Number.isFinite(thirdGeometry.o.y)) return anchorPoint;
      const sign = sideSign || anchorSideSignForThird(thirdGeometry, anchorPoint);
      const horizonY = thirdGeometry.o.y;
      const safeY = sign < 0
        ? Math.min(anchorPoint.y, horizonY - MIN_A_HORIZON_DISTANCE)
        : Math.max(anchorPoint.y, horizonY + MIN_A_HORIZON_DISTANCE);
      return pt(anchorPoint.x, safeY);
    }

    function lowerCirclePoint(boundary, x) {
      const safeX = clamp(x, boundary.center.x - boundary.radius, boundary.center.x + boundary.radius);
      const dy = Math.sqrt(Math.max(0, boundary.radius ** 2 - (safeX - boundary.center.x) ** 2));
      return pt(safeX, boundary.center.y + dy);
    }

    function threePointGeometry(cvPoint, observerDistance) {
      const dx = Math.max(MIN_P_CV_DISTANCE, observerDistance || 220);
      const thetaDeg = clamp(Number.isFinite(FRONT2D_STATE.thetaDeg) ? FRONT2D_STATE.thetaDeg : 35, -89, 89);
      const safeThetaDeg = Math.abs(thetaDeg) < 1 ? (thetaDeg < 0 ? -1 : 1) : thetaDeg;
      const theta = safeThetaDeg * Math.PI / 180;
      const tangent = Math.tan(theta);
      const sign = safeThetaDeg < 0 ? -1 : 1;
      const pTheta = pt(cvPoint.x + dx, cvPoint.y);
      const oPoint = pt(cvPoint.x, cvPoint.y - tangent * dx);
      const vp3Y = cvPoint.y + dx / tangent;
      const vp3Point = pt(cvPoint.x, vp3Y);
      return {
        cv: cvPoint,
        o: oPoint,
        vp3: vp3Point,
        pTheta,
        thetaDeg,
        viewSign: sign,
        circle: {
          center: pt(cvPoint.x, (oPoint.y + vp3Point.y) / 2),
          radius: Math.abs(vp3Point.y - oPoint.y) / 2
        }
      };
    }

    function groundConstruction(vp1Point, vp2Point, third) {
      const vp1Prime = pt(vp1Point.x, vp1Point.y);
      const vp2Prime = pt(vp2Point.x, vp2Point.y);
      const center = pt((vp1Prime.x + vp2Prime.x) / 2, third.o.y);
      const radius = Math.abs(vp2Prime.x - vp1Prime.x) / 2;
      const dx = third.o.x - center.x;
      const dy = Math.sqrt(Math.max(0, radius ** 2 - dx ** 2));
      const towardVp3 = Math.sign(third.vp3.y - third.o.y) || 1;
      return {
        vp1Prime,
        vp2Prime,
        p2: pt(third.o.x, third.o.y + towardVp3 * dy),
        circle: { center, radius }
      };
    }

    function groundObserverGap(fallbackGap) {
      const value = Number.isFinite(FRONT2D_STATE.p2Distance) ? FRONT2D_STATE.p2Distance : fallbackGap;
      return Math.max(MIN_P_CV_DISTANCE, value || MIN_P_CV_DISTANCE);
    }

    function geometryFromRotationAngle(anchor, angleDeg, cvPoint, observerPoint, third = threePointGeometry(cvPoint), forcedProjectedSideLength = null, options = null) {
      const angleRad = clamp(angleDeg, 1, 89) * Math.PI / 180;
      const horizonY = third.o.y;
      const allowHorizonCrossing = Boolean(options && options.allowHorizonCrossing);
      const sideSign = Number.isFinite(options && options.lockSideSign)
        ? options.lockSideSign
        : anchorSideSignForThird(third, anchor);
      const safeAnchor = allowHorizonCrossing
        ? pt(anchor.x, anchor.y)
        : clampAnchorAwayFromHorizon(anchor, third, sideSign);
      const horizonGap = Math.max(MIN_A_HORIZON_DISTANCE, Math.abs(safeAnchor.y - horizonY));
      const layoutAnchor = pt(safeAnchor.x, horizonY + sideSign * horizonGap);
      const observerGap = Math.max(1, observerPoint.y - FRONT2D_STATE.horizonY);
      const p2Gap = groundObserverGap(observerGap);
      const rightVpGap = Math.max(4, p2Gap / Math.tan(angleRad));
      const vprX = cvPoint.x + rightVpGap;
      const vprPoint = pt(vprX, horizonY);
      if (!isFinitePoint(vprPoint)) return null;

      const vplX = cvPoint.x - p2Gap ** 2 / rightVpGap;
      const vplPoint = pt(vplX, horizonY);
      if (!isFinitePoint(vplPoint)) return null;

      const circleCenter = pt((vplPoint.x + vprPoint.x) / 2, horizonY);
      const circle = {
        center: circleCenter,
        radius: Math.abs(vprPoint.x - vplPoint.x) / 2
      };
      const ground = groundConstruction(vplPoint, vprPoint, third);
      const horizontalObserver = ground.p2;
      let q1Point = pt(vplPoint.x + distance(horizontalObserver, vplPoint), horizonY);
      let q2Point = pt(vprPoint.x - distance(horizontalObserver, vprPoint), horizonY);
      // a 是二维画面中的基准下角点。拖拽 a 时，VP1/VP2/VP3/P2 不动；拖拽 P2 时，圆整体按 O 为基准等比缩放。
      // 三点透视的竖向量距点必须先由 VP3-P1 旋到 VP3 水平线得到：VP3P1 = VP3Y。
      // 再用 a-Y 与过 A 的水平线交出 S，S-Q1 与 A-VP1 交出 B，之后继续推出其余点。
      const aPoint = safeAnchor;
      const sideLength = Number.isFinite(forcedProjectedSideLength)
        ? clamp(forcedProjectedSideLength, 8, 320)
        : projectedSideLengthAtAnchor(aPoint, vplPoint, vprPoint, third);
      const APoint = verticalTopPoint(aPoint, third.vp3, sideLength, third.viewSign);
      const measure = verticalMeasureConstruction(third.vp3, third.pTheta, aPoint, APoint, vplPoint, q1Point);
      if (!measure) return null;
      const yPoint = measure.y;
      const sPoint = measure.s;
      const BPoint = measure.B;

      const saLength = Math.max(1, Math.abs(APoint.x - sPoint.x));
      const tPoint = pt(APoint.x + saLength, APoint.y);
      const CPoint = intersect(tPoint, q2Point, APoint, vprPoint);
      if (!isFinitePoint(CPoint)) return null;

      const DPoint = intersect(BPoint, vprPoint, CPoint, vplPoint);
      if (!isFinitePoint(DPoint)) return null;

      const bPoint = intersect(aPoint, vplPoint, BPoint, third.vp3);
      const cPoint = intersect(aPoint, vprPoint, CPoint, third.vp3);
      if (!isFinitePoint(bPoint) || !isFinitePoint(cPoint)) return null;

      const dFromB = intersect(bPoint, vprPoint, DPoint, third.vp3);
      const dFromC = intersect(cPoint, vplPoint, DPoint, third.vp3);
      if (!isFinitePoint(dFromB) || !isFinitePoint(dFromC)) return null;
      const dPoint = pt((dFromB.x + dFromC.x) / 2, (dFromB.y + dFromC.y) / 2);
      const points = {
        a: aPoint,
        b: bPoint,
        c: cPoint,
        d: dPoint,
        A: APoint,
        B: BPoint,
        C: CPoint,
        D: DPoint
      };
      for (const point of Object.values(points)) {
        if (!isFinitePoint(point)) return null;
      }
      return {
        vpCircle: circle,
        vpl: vplPoint,
        vpr: vprPoint,
        q1: q1Point,
        q2: q2Point,
        e: sPoint,
        f: tPoint,
        s: sPoint,
        t: tPoint,
        y: yPoint,
        ground,
        cube: points,
        projectedSideLength: sideLength,
        third
      };
    }

    function horizontalLineWithLine(y, p, q) {
      const dy = q.y - p.y;
      if (Math.abs(dy) < 1e-9) return pt(NaN, NaN);
      const u = (y - p.y) / dy;
      return pt(p.x + (q.x - p.x) * u, y);
    }

    function verticalMeasureConstruction(vp3Point, p1Point, aPoint, APoint, vplPoint, q1Point) {
      const radius = Math.max(1, distance(vp3Point, p1Point));
      const candidates = [
        pt(vp3Point.x + radius, vp3Point.y),
        pt(vp3Point.x - radius, vp3Point.y)
      ];
      let best = null;
      let bestScore = Infinity;
      for (const yPoint of candidates) {
        const sPoint = horizontalLineWithLine(APoint.y, aPoint, yPoint);
        if (!isFinitePoint(sPoint)) continue;
        const BPoint = intersect(APoint, vplPoint, sPoint, q1Point);
        if (!isFinitePoint(BPoint)) continue;

        const towardVp1 =
          (BPoint.x - APoint.x) * (vplPoint.x - APoint.x) +
          (BPoint.y - APoint.y) * (vplPoint.y - APoint.y);
        const towardScore = towardVp1 >= -1e-6 ? 0 : 1000000;
        const leftMeasureScore = sPoint.x <= APoint.x ? 0 : 100000;
        const compactScore = distance(APoint, BPoint) + 0.05 * distance(APoint, sPoint);
        const score = towardScore + leftMeasureScore + compactScore;
        if (score < bestScore) {
          bestScore = score;
          best = { y: yPoint, s: sPoint, B: BPoint };
        }
      }
      return best;
    }

    function horizontalRotationPoint(vp3Point, p1Point, APoint, sPoint, sideLength) {
      const radius = Math.max(1, distance(vp3Point, p1Point));
      const candidates = [
        pt(vp3Point.x + radius, vp3Point.y),
        pt(vp3Point.x - radius, vp3Point.y)
      ];
      let best = null;
      let bestScore = Infinity;
      for (const yPoint of candidates) {
        const aPoint = intersect(sPoint, yPoint, APoint, vp3Point);
        if (!isFinitePoint(aPoint)) continue;
        const towardVp3 =
          (aPoint.x - APoint.x) * (vp3Point.x - APoint.x) +
          (aPoint.y - APoint.y) * (vp3Point.y - APoint.y);
        const sideScore = towardVp3 > 0 ? 0 : 100000;
        const lengthScore = Math.abs(distance(APoint, aPoint) - sideLength);
        const score = sideScore + lengthScore;
        if (score < bestScore) {
          bestScore = score;
          best = { y: yPoint, a: aPoint };
        }
      }
      return best;
    }

    function pointAwayFrom(from, vanishingPoint, lengthValue) {
      const dx = from.x - vanishingPoint.x;
      const dy = from.y - vanishingPoint.y;
      const n = Math.hypot(dx, dy);
      if (n < 1e-9) return pt(from.x, from.y - lengthValue);
      return pt(from.x + dx / n * lengthValue, from.y + dy / n * lengthValue);
    }

    function pointTowardVp(from, targetPoint, lengthValue) {
      const dx = targetPoint.x - from.x;
      const dy = targetPoint.y - from.y;
      const n = Math.hypot(dx, dy);
      if (n < 1e-9) return pt(from.x, from.y - lengthValue);
      return pt(from.x + dx / n * lengthValue, from.y + dy / n * lengthValue);
    }

    function verticalTopPoint(from, vp3Point, lengthValue, viewSign) {
      return viewSign < 0
        ? pointTowardVp(from, vp3Point, lengthValue)
        : pointAwayFrom(from, vp3Point, lengthValue);
    }

    function verticalBottomPoint(from, vp3Point, lengthValue, viewSign) {
      return viewSign < 0
        ? pointAwayFrom(from, vp3Point, lengthValue)
        : pointTowardVp(from, vp3Point, lengthValue);
    }

    function elevatedAnchorFromBase(basePoint, thirdGeometry, sideLength, heightUnits) {
      const h = clampNumeric(Number(heightUnits), 0, 5);
      if (!h) return pt(basePoint.x, basePoint.y);
      return verticalTopPoint(basePoint, thirdGeometry.vp3, sideLength * h, thirdGeometry.viewSign);
    }

    function baseAnchorFromElevated(elevatedPoint, thirdGeometry, sideLength, heightUnits) {
      const h = clampNumeric(Number(heightUnits), 0, 5);
      if (!h) return pt(elevatedPoint.x, elevatedPoint.y);
      return verticalBottomPoint(elevatedPoint, thirdGeometry.vp3, sideLength * h, thirdGeometry.viewSign);
    }

    function frontGroundZForThreePoint(vplPoint, vprPoint, thirdGeometry, anchorPoint) {
      const frame = frontPictureFrameBounds(vplPoint, vprPoint, thirdGeometry.cv || thirdGeometry.o);
      const sideSign = anchorPoint.y < thirdGeometry.o.y ? -1 : 1;
      const edgeY = sideSign < 0 ? frame.top : frame.bottom;
      return Math.max(1, Math.abs(edgeY - thirdGeometry.o.y));
    }

    function projectedSideLengthAtAnchor(anchorPoint, vplPoint, vprPoint, thirdGeometry) {
      const groundZ = frontGroundZForThreePoint(vplPoint, vprPoint, thirdGeometry, anchorPoint);
      const anchorZ = Math.max(1, Math.abs(anchorPoint.y - thirdGeometry.o.y));
      if (!Number.isFinite(FRONT2D_STATE.cubeTrueSize)) {
        FRONT2D_STATE.cubeTrueSize = Math.max(1, FRONT2D_STATE.cubeSize) * groundZ / anchorZ;
      }
      const projectedLength = anchorZ * FRONT2D_STATE.cubeTrueSize / groundZ;
      return clamp(projectedLength, 8, 320);
    }

    function projectedVerticalLengthFromDrag(basePoint, dragPoint, vp3Point, viewSign) {
      const topPoint = verticalTopPoint(basePoint, vp3Point, 1, viewSign);
      const dx = topPoint.x - basePoint.x;
      const dy = topPoint.y - basePoint.y;
      const n = Math.hypot(dx, dy);
      if (n < 1e-9) return clamp(distance(basePoint, dragPoint), 8, 320);
      const projected = (dragPoint.x - basePoint.x) * dx / n + (dragPoint.y - basePoint.y) * dy / n;
      return clamp(projected, 8, 320);
    }

    function drawFrontPictureFrame(parent, vplPoint, vprPoint, centerPoint) {
      const frame = frontPictureFrameBounds(vplPoint, vprPoint, centerPoint);
      const corners = [
        pt(frame.left, frame.top),
        pt(frame.right, frame.top),
        pt(frame.right, frame.bottom),
        pt(frame.left, frame.bottom)
      ];
      for (let i = 0; i < corners.length; i++) {
        const edge = line(parent, corners[i], corners[(i + 1) % corners.length], SVG_COLORS.gray, 1.5);
        edge.style.pointerEvents = 'none';
      }
    }

    function frontPictureFrameBounds(vplPoint, vprPoint, centerPoint = null) {
      const span = Math.max(1, distance(vplPoint, vprPoint));
      const center = centerPoint || pt((vplPoint.x + vprPoint.x) / 2, (vplPoint.y + vprPoint.y) / 2);
      const size = Math.max(
        span,
        distance(center, vplPoint) * 2,
        distance(center, vprPoint) * 2
      ) * 1.12;
      const half = size / 2;
      return {
        left: center.x - half,
        right: center.x + half,
        top: center.y - half,
        bottom: center.y + half,
        width: size,
        height: size
      };
    }

    function nearestValidRotationAngle(anchor, desiredAngle, cvPoint, observerPoint, thirdGeometry = third, forcedProjectedSideLength = null) {
      const desired = clamp(desiredAngle, 1, 89);
      if (isValidRotationAngle(anchor, desired, cvPoint, observerPoint, thirdGeometry, forcedProjectedSideLength)) return desired;

      for (let offset = 0.25; offset < 88; offset += 0.25) {
        const lower = desired - offset;
        if (lower >= 1 && isValidRotationAngle(anchor, lower, cvPoint, observerPoint, thirdGeometry, forcedProjectedSideLength)) return lower;

        const upper = desired + offset;
        if (upper < 89 && isValidRotationAngle(anchor, upper, cvPoint, observerPoint, thirdGeometry, forcedProjectedSideLength)) return upper;
      }
      return desired;
    }

    function isValidRotationAngle(anchor, angle, cvPoint, observerPoint, thirdGeometry = third, forcedProjectedSideLength = null) {
      return Boolean(geometryFromRotationAngle(anchor, angle, cvPoint, observerPoint, thirdGeometry, forcedProjectedSideLength));
    }

    function clampPointToCircle(p, boundary, margin) {
      const maxRadius = Math.max(1, boundary.radius - margin);
      const dx = p.x - boundary.center.x;
      const dy = p.y - boundary.center.y;
      const length = Math.hypot(dx, dy);
      if (length <= maxRadius) return p;
      return pt(
        boundary.center.x + dx / length * maxRadius,
        boundary.center.y + dy / length * maxRadius
      );
    }

    function clampAnchorPoint(p, boundary, margin) {
      return clampPointToCircle(p, boundary, margin);
    }

    function svgPointFromEvent(event) {
      const point = svg.createSVGPoint();
      point.x = event.clientX;
      point.y = event.clientY;
      const rawPoint = point.matrixTransform(svg.getScreenCTM().inverse());
      const basePoint = { x: rawPoint.x, y: rawPoint.y };
      return Math.abs(horizonRotateDeg) > 1e-9
        ? rotateFrontPointAround(basePoint, third.o, -horizonRotateDeg)
        : basePoint;
    }

    function onCvDrag(event) {
      const p = svgPointFromEvent(event);
      const x = clamp(p.x, vpl.x + 1, vpr.x - 1);
      FRONT2D_STATE.cvX = x;
      drawFront2d();
    }

    function onPDrag(event) {
      const p = svgPointFromEvent(event);
      const nextGap = clamp(p.x - cv.x, MIN_P_CV_DISTANCE, 520);
      const nextPY = FRONT2D_STATE.horizonY + nextGap;
      FRONT2D_STATE.pY = nextPY;
      drawFront2d();
    }

    function onVplDrag(event) {
      const p = svgPointFromEvent(event);
      const fallbackGap = Math.max(1, planObserver.y - FRONT2D_STATE.horizonY);
      const p2Gap = groundObserverGap(fallbackGap);
      const leftGap = Math.max(4, cv.x - p.x);
      const nextVprX = cv.x + p2Gap ** 2 / leftGap;
      setVprX(nextVprX, planObserver);
      drawFront2d();
    }

    function onVprDrag(event) {
      const p = svgPointFromEvent(event);
      const rightGap = Math.max(4, p.x - cv.x);
      setVprX(cv.x + rightGap, planObserver);
      drawFront2d();
    }

    function setVprX(vprX, observerPoint) {
      const angle = angleForVprX(Math.max(cv.x + 4, vprX));
      // 旋转有效性也以地面基准 baseA 为准，避免高度后的显示 a 越线时误判。
      FRONT2D_STATE.vprAngleDeg = nearestValidRotationAngle(baseA || a, angle, cv, observerPoint, third);
    }

    function angleForVprX(vprX) {
      const fallbackGap = Math.max(1, planObserver.y - FRONT2D_STATE.horizonY);
      const horizonGap = groundObserverGap(fallbackGap);
      const xGap = Math.max(1, vprX - cv.x);
      return clamp(Math.atan2(horizonGap, xGap) * 180 / Math.PI, 1, 89);
    }

    function onP2Drag(event) {
      const p = svgPointFromEvent(event);
      const towardVp3 = Math.sign(third.vp3.y - third.o.y) || 1;
      const rawDistance = towardVp3 * (p.y - third.o.y);
      const frame = frontPictureFrameBounds(vpl, vpr, cv);
      const frameDistance = Math.max(
        Math.abs(frame.top - third.o.y),
        Math.abs(frame.bottom - third.o.y),
        MIN_P_CV_DISTANCE
      );
      FRONT2D_STATE.p2Distance = clamp(rawDistance, MIN_P_CV_DISTANCE, Math.max(520, frameDistance * 2.2));
      drawFront2d();
    }

    function onADrag(event) {
      const p = svgPointFromEvent(event);
      const lockedSide = anchorSideSignForThird(third, baseA || a);
      // 用户拖的是“显示 a”；真正需要防越线的是减去高度后的 baseA。
      // 因此不能先把显示 a clamp 到 VP1-VP2 一侧，否则高度导致的越线会被错误禁止。
      const targetElevated = p;
      const basePoint = baseAnchorFromElevated(targetElevated, third, dDragLockedSideLength, FRONT2D_STATE.heightUnits);
      const safePoint = clampAnchorAwayFromHorizon(basePoint, third, lockedSide);
      FRONT2D_STATE.aX = safePoint.x;
      FRONT2D_STATE.aY = safePoint.y;
      drawFront2d();
    }

    function onUpperADrag(event) {
      const p = svgPointFromEvent(event);
      const projectedSize = projectedVerticalLengthFromDrag(a, p, third.vp3, third.viewSign);
      const groundZ = frontGroundZForThreePoint(vpl, vpr, third, a);
      const anchorZ = Math.max(1, Math.abs(a.y - third.o.y));
      FRONT2D_STATE.cubeTrueSize = projectedSize * groundZ / anchorZ;
      FRONT2D_STATE.cubeSize = projectedSize;
      drawFront2d();
    }

    function onODrag(event) {
      const p = svgPointFromEvent(event);
      const gap = Math.max(MIN_P_CV_DISTANCE, planObserver.y - FRONT2D_STATE.horizonY);
      const sign = FRONT2D_STATE.thetaDeg < 0 ? -1 : 1;
      const rise = clamp(sign * (cv.y - p.y), 8, gap * Math.tan(80 * Math.PI / 180));
      FRONT2D_STATE.thetaDeg = sign * clamp(Math.atan2(rise, gap) * 180 / Math.PI, 1, 89);
      syncFrontControls();
      drawFront2d();
    }

    function onVp3Drag(event) {
      const p = svgPointFromEvent(event);
      const gap = Math.max(MIN_P_CV_DISTANCE, planObserver.y - FRONT2D_STATE.horizonY);
      const sign = FRONT2D_STATE.thetaDeg < 0 ? -1 : 1;
      const fall = clamp(sign * (p.y - cv.y), gap / Math.tan(80 * Math.PI / 180), gap / Math.tan(5 * Math.PI / 180));
      FRONT2D_STATE.thetaDeg = sign * clamp(Math.atan2(gap, fall) * 180 / Math.PI, 1, 89);
      syncFrontControls();
      drawFront2d();
    }

    function onDDrag(event) {
      const target = svgPointFromEvent(event);
      const lockedSideLength = dDragLockedSideLength;
      const angle = angleForNearestD(target, lockedSideLength);
      const nextGeom = geometryFromRotationAngle(a, angle, cv, planObserver, third, lockedSideLength);
      if (!nextGeom) return;

      FRONT2D_STATE.vprAngleDeg = angle;
      FRONT2D_STATE.cubeSize = lockedSideLength;
      FRONT2D_STATE.cubeTrueSize = trueSizeForProjectedSideLength(a, nextGeom.vpl, nextGeom.vpr, third, lockedSideLength);
      drawFront2d();
    }

    function angleForNearestD(target, lockedSideLength) {
      const interval = validRotationInterval(a, FRONT2D_STATE.vprAngleDeg, cv, planObserver, third, lockedSideLength);
      if (!interval) return FRONT2D_STATE.vprAngleDeg;

      const coarseCount = 24;
      const step = (interval.max - interval.min) / coarseCount;
      let bestAngle = clamp(FRONT2D_STATE.vprAngleDeg, interval.min, interval.max);
      let bestScore = dDragScore(bestAngle, target, lockedSideLength);

      for (let i = 0; i <= coarseCount; i++) {
        const angle = interval.min + step * i;
        const score = dDragScore(angle, target, lockedSideLength);
        if (score < bestScore) {
          bestScore = score;
          bestAngle = angle;
        }
      }

      let left = Math.max(interval.min, bestAngle - step);
      let right = Math.min(interval.max, bestAngle + step);
      for (let i = 0; i < 28; i++) {
        const m1 = left + (right - left) / 3;
        const m2 = right - (right - left) / 3;
        if (dDragScore(m1, target, lockedSideLength) < dDragScore(m2, target, lockedSideLength)) {
          right = m2;
        } else {
          left = m1;
        }
      }

      const refinedAngle = (left + right) / 2;
      for (const angle of [interval.min, interval.max, refinedAngle]) {
        const score = dDragScore(angle, target, lockedSideLength);
        if (score < bestScore) {
          bestScore = score;
          bestAngle = angle;
        }
      }
      return bestAngle;
    }

    function dDragScore(angle, target, lockedSideLength) {
      const candidate = geometryFromRotationAngle(a, angle, cv, planObserver, third, lockedSideLength);
      return candidate ? distance(candidate.cube.D, target) : Infinity;
    }

    function trueSizeForProjectedSideLength(anchorPoint, vplPoint, vprPoint, thirdGeometry, projectedSideLength) {
      const groundZ = frontGroundZForThreePoint(vplPoint, vprPoint, thirdGeometry, anchorPoint);
      const anchorZ = Math.max(1, Math.abs(anchorPoint.y - thirdGeometry.o.y));
      return clamp(projectedSideLength, 8, 320) * groundZ / anchorZ;
    }

    function validRotationInterval(anchor, seedAngle, cvPoint, observerPoint, thirdGeometry = third, forcedProjectedSideLength = null) {
      const minAngle = 1;
      const maxAngle = 89;
      const scanStep = 0.5;
      let seed = clamp(seedAngle, minAngle, maxAngle);
      if (!isValidRotationAngle(anchor, seed, cvPoint, observerPoint, thirdGeometry, forcedProjectedSideLength)) {
        seed = nearestValidRotationAngle(anchor, seed, cvPoint, observerPoint, thirdGeometry, forcedProjectedSideLength);
      }
      if (!isValidRotationAngle(anchor, seed, cvPoint, observerPoint, thirdGeometry, forcedProjectedSideLength)) return null;

      let min = seed;
      while (min - scanStep >= minAngle && isValidRotationAngle(anchor, min - scanStep, cvPoint, observerPoint, thirdGeometry, forcedProjectedSideLength)) {
        min -= scanStep;
      }
      if (min - scanStep >= minAngle) {
        min = refineValidBoundary(anchor, min, min - scanStep, cvPoint, observerPoint, thirdGeometry, forcedProjectedSideLength);
      } else if (isValidRotationAngle(anchor, minAngle, cvPoint, observerPoint, thirdGeometry, forcedProjectedSideLength)) {
        min = minAngle;
      }

      let max = seed;
      while (max + scanStep < maxAngle && isValidRotationAngle(anchor, max + scanStep, cvPoint, observerPoint, thirdGeometry, forcedProjectedSideLength)) {
        max += scanStep;
      }
      if (max + scanStep < maxAngle) {
        max = refineValidBoundary(anchor, max, max + scanStep, cvPoint, observerPoint, thirdGeometry, forcedProjectedSideLength);
      } else if (isValidRotationAngle(anchor, maxAngle, cvPoint, observerPoint, thirdGeometry, forcedProjectedSideLength)) {
        max = maxAngle;
      }

      return { min, max };
    }

    function refineValidBoundary(anchor, validAngle, invalidAngle, cvPoint, observerPoint, thirdGeometry = third, forcedProjectedSideLength = null) {
      let valid = validAngle;
      let invalid = invalidAngle;
      for (let i = 0; i < 24; i++) {
        const mid = (valid + invalid) / 2;
        if (isValidRotationAngle(anchor, mid, cvPoint, observerPoint, thirdGeometry, forcedProjectedSideLength)) {
          valid = mid;
        } else {
          invalid = mid;
        }
      }
      return valid;
    }

    function isFinitePoint(p) {
      return Number.isFinite(p.x) && Number.isFinite(p.y);
    }

    function drawDisplayStage(parent, geom) {
      const stage = FRONT2D_STATE.displayStage;

      line(parent, geom.cv, geom.observer, SVG_COLORS.green, 1.2);
      point(parent, geom.cv, SVG_COLORS.green, 5, 'CV');
      point(parent, geom.observer, SVG_COLORS.green, 5, 'P1');
      dragHandle(parent, geom.cv, 13, onCvDrag, 'CV');
      dragHandle(parent, geom.observer, 13, onPDrag, 'P1');
      if (FRONT2D_STATE.showLabels) {
        label(parent, 'CV', geom.cv, SVG_COLORS.green);
        label(parent, 'P1', geom.observer, SVG_COLORS.green);
      }

      if (stage >= 2) {
        line(parent, geom.vpl, geom.vpr, SVG_COLORS.black, 1.1);
        if (geom.third) {
          line(parent, pt(-5000, geom.third.o.y), pt(5000, geom.third.o.y), SVG_COLORS.horizon, 0.7);
          circle(parent, geom.third.circle.center, geom.third.circle.radius, 'none', SVG_COLORS.horizon, 0.8);
          line(parent, geom.third.o, geom.third.vp3, SVG_COLORS.green, 0.9);
          line(parent, geom.cv, geom.third.pTheta, SVG_COLORS.green, 1);
          line(parent, geom.third.pTheta, geom.third.o, SVG_COLORS.orange, 1);
          line(parent, geom.third.pTheta, geom.third.vp3, SVG_COLORS.purple, 1);
          if (geom.ground) {
            circle(parent, geom.ground.circle.center, geom.ground.circle.radius, 'none', SVG_COLORS.horizon, 0.8);
          }
        }
        line(parent, geom.planObserver || geom.observer, geom.vpl, SVG_COLORS.blue, 1);
        line(parent, geom.planObserver || geom.observer, geom.vpr, SVG_COLORS.yellow, 1);
        line(parent, geom.vpl, pt(geom.vpl.x, 65), SVG_COLORS.blue, 1.6);
        line(parent, geom.vpr, pt(geom.vpr.x, 65), SVG_COLORS.yellow, 1.6);
        point(parent, geom.vpl, SVG_COLORS.blue, 5, 'VP1');
        point(parent, geom.vpr, SVG_COLORS.yellow, 5, 'VP2');
        dragHandle(parent, geom.vpl, 13, onVplDrag, 'VP1');
        dragHandle(parent, geom.vpr, 13, onVprDrag, 'VP2');
        if (geom.third) {
          point(parent, geom.third.o, SVG_COLORS.green, 4, 'O');
          point(parent, geom.third.vp3, SVG_COLORS.pink, 5, 'VP3');
        }
        if (geom.ground) {
          point(parent, geom.ground.p2, SVG_COLORS.green, 5, 'P2');
          dragHandle(parent, geom.ground.p2, 13, onP2Drag, 'P2');
        }
        point(parent, geom.q1, SVG_COLORS.half, 3, 'P(Q1)');
        point(parent, geom.q2, SVG_COLORS.half, 3, 'P(Q2)');
        if (FRONT2D_STATE.showLabels) {
          label(parent, 'VP1', geom.vpl, SVG_COLORS.blue);
          label(parent, 'VP2', geom.vpr, SVG_COLORS.yellow);
          if (geom.third) {
            label(parent, 'O', geom.third.o, SVG_COLORS.green);
            label(parent, 'VP3', geom.third.vp3, SVG_COLORS.pink);
            drawAngleLabel(parent, 'θ', geom.third.pTheta, geom.cv, geom.third.o, SVG_COLORS.green, 18);
          }
          if (geom.ground) {
            label(parent, 'P2', geom.ground.p2, SVG_COLORS.green);
          }
          label(parent, 'P(Q1)', geom.q1, SVG_COLORS.half);
          label(parent, 'P(Q2)', geom.q2, SVG_COLORS.half);
          drawAngleLabel(parent, 'α', geom.planObserver || geom.observer, geom.third ? geom.third.o : geom.cv, geom.vpl, SVG_COLORS.blue, 24);
          drawAngleLabel(parent, 'β', geom.planObserver || geom.observer, geom.third ? geom.third.o : geom.cv, geom.vpr, SVG_COLORS.yellow, 34);
        }
      }

      if (stage >= 3) {
        line(parent, geom.a, geom.A, SVG_COLORS.black, 3);
        point(parent, geom.a, SVG_COLORS.black, 5, 'a');
        point(parent, geom.A, SVG_COLORS.black, 5, 'A');
        dragHandle(parent, geom.a, 13, onADrag, 'a');
        dragHandle(parent, geom.A, 13, onUpperADrag, 'A');
        if (FRONT2D_STATE.showLabels) {
          label(parent, 'a', geom.a, SVG_COLORS.black);
          label(parent, 'A', geom.A, SVG_COLORS.black);
        }
      }
    }

    function roofGeometry(cubePoints, q1Point, vplPoint, q2Point, vprPoint) {
      const deltaRad = clamp(FRONT2D_STATE.roofDeltaDeg, 1, 80) * Math.PI / 180;
      const q1ToVplGap = Math.max(1, Math.abs(q1Point.x - vplPoint.x));
      const s1Point = pt(vplPoint.x, q1Point.y - Math.tan(deltaRad) * q1ToVplGap);
      const q2ToVprGap = Math.max(1, Math.abs(vprPoint.x - q2Point.x));
      const s2Point = pt(vprPoint.x, q2Point.y - Math.tan(deltaRad) * q2ToVprGap);
      const EPoint = intersect(cubePoints.A, s1Point, cubePoints.B, cubePoints.b);
      const FPoint = intersect(cubePoints.C, s1Point, cubePoints.D, cubePoints.d);
      if (!isFinitePoint(s1Point) || !isFinitePoint(s2Point) || !isFinitePoint(EPoint) || !isFinitePoint(FPoint)) return null;
      return {
        s1: s1Point,
        s2: s2Point,
        E: EPoint,
        F: FPoint
      };
    }

    function pointToward(from, to, length, fallback) {
      const dir = unitVector(from, to, fallback);
      return pt(from.x + dir.x * length, from.y + dir.y * length);
    }

    function unitVector(from, to, fallback) {
      const dx = to.x - from.x;
      const dy = to.y - from.y;
      const n = Math.hypot(dx, dy);
      if (n < 1e-9) return fallback;
      return pt(dx / n, dy / n);
    }

    function exampleLine(parent, p, q) {
      const el = line(parent, p, q, '#333', 1.25);
      el.setAttribute('stroke-linejoin', 'round');
      return el;
    }

    function exampleCircle(parent, center, radius) {
      return circle(parent, center, radius, '#ffd4df', '#333', 1.25);
    }

    function exampleHead(parent, center, rx, ry, rotate) {
      return exampleEllipse(parent, center, rx, ry, rotate);
    }

    function exampleNose(parent, center, size, direction) {
      const dir = unitVector(pt(0, 0), direction, pt(1, 0));
      const normal = pt(-dir.y, dir.x);
      const base1 = pt(center.x + normal.x * size * 0.45, center.y + normal.y * size * 0.45);
      const base2 = pt(center.x - normal.x * size * 0.45, center.y - normal.y * size * 0.45);
      const tip = pt(center.x + dir.x * size * 1.35, center.y + dir.y * size * 1.35);
      return poly(parent, [base1, tip, base2], '#ffd4df', '#333', 1);
    }

    function exampleHandArc(parent, p, q, bodyCenter, height) {
      const mid = pt((p.x + q.x) / 2, (p.y + q.y) / 2);
      const away = unitVector(bodyCenter, mid, pt(0, -1));
      const control = pt(mid.x + away.x * height * 0.18, mid.y + away.y * height * 0.18);
      const arc = path(parent, `M ${p.x} ${p.y} Q ${control.x} ${control.y} ${q.x} ${q.y}`, 'none', '#333', 0.9);
      arc.style.pointerEvents = 'none';
      const delta = text(parent, 'δ', control.x, control.y - height * 0.04, '#333', 9);
      delta.style.pointerEvents = 'none';
      return arc;
    }

    function exampleEye(parent, center, radius) {
      return circle(parent, center, radius, '#111', 'none', 0);
    }

    function exampleEllipse(parent, center, rx, ry, rotate) {
      const el = document.createElementNS(NS, 'ellipse');
      el.setAttribute('cx', center.x);
      el.setAttribute('cy', center.y);
      el.setAttribute('rx', rx);
      el.setAttribute('ry', ry);
      el.setAttribute('fill', '#ffd4df');
      el.setAttribute('stroke', '#333');
      el.setAttribute('stroke-width', 1.25);
      el.setAttribute('stroke-linejoin', 'round');
      el.setAttribute('transform', `rotate(${rotate} ${center.x} ${center.y})`);
      parent.appendChild(el);
      return el;
    }

    function intersect(p1, p2, p3, p4) {
      const den = (p1.x - p2.x) * (p3.y - p4.y) - (p1.y - p2.y) * (p3.x - p4.x);
      const a1 = p1.x * p2.y - p1.y * p2.x;
      const a2 = p3.x * p4.y - p3.y * p4.x;
      return pt(
        (a1 * (p3.x - p4.x) - (p1.x - p2.x) * a2) / den,
        (a1 * (p3.y - p4.y) - (p1.y - p2.y) * a2) / den
      );
    }

    function verticalLineWithLine(x, p, q) {
      const t = (x - p.x) / (q.x - p.x);
      return pt(x, p.y + (q.y - p.y) * t);
    }

    function visibleCubeEdgeKeys(points) {
      // Convex cuboid hidden-line rule: projected faces with the visible winding
      // expose their boundary edges; edges belonging only to back faces are gray.
      const visible = new Set();
      for (const face of CUBE_FACES) {
        const polygon = face.map(name => points[name]);
        if (polygonSignedArea(polygon) <= 1e-6) continue;
        for (let i = 0; i < face.length; i++) {
          visible.add(edgeKey(face[i], face[(i + 1) % face.length]));
        }
      }
      return visible;
    }

    function polygonSignedArea(polygon) {
      let area = 0;
      for (let i = 0; i < polygon.length; i++) {
        const p = polygon[i];
        const q = polygon[(i + 1) % polygon.length];
        area += p.x * q.y - q.x * p.y;
      }
      return area / 2;
    }

    function edgeKey(aName, bName) {
      return [aName, bName].sort().join('-');
    }

    function angleDeg(aPoint, oPoint, bPoint) {
      const v1 = pt(aPoint.x - oPoint.x, aPoint.y - oPoint.y);
      const v2 = pt(bPoint.x - oPoint.x, bPoint.y - oPoint.y);
      const dot = v1.x * v2.x + v1.y * v2.y;
      const n1 = Math.hypot(v1.x, v1.y);
      const n2 = Math.hypot(v2.x, v2.y);
      return Math.acos(clamp(dot / (n1 * n2), -1, 1)) * 180 / Math.PI;
    }

    function polarAngle(oPoint, p) {
      return Math.atan2(p.y - oPoint.y, p.x - oPoint.x);
    }

    function arcPath(oPoint, p1, p2, radius) {
      let a1 = polarAngle(oPoint, p1);
      let a2 = polarAngle(oPoint, p2);
      while (a2 < a1) a2 += Math.PI * 2;
      if (a2 - a1 > Math.PI) [a1, a2] = [a2, a1 + Math.PI * 2];
      const start = pt(oPoint.x + Math.cos(a1) * radius, oPoint.y + Math.sin(a1) * radius);
      const end = pt(oPoint.x + Math.cos(a2) * radius, oPoint.y + Math.sin(a2) * radius);
      return `M ${start.x} ${start.y} A ${radius} ${radius} 0 0 1 ${end.x} ${end.y}`;
    }

    function fovLabelPoint(oPoint, p1, p2, radius) {
      let a1 = polarAngle(oPoint, p1);
      let a2 = polarAngle(oPoint, p2);
      while (a2 < a1) a2 += Math.PI * 2;
      if (a2 - a1 > Math.PI) [a1, a2] = [a2, a1 + Math.PI * 2];
      const mid = (a1 + a2) / 2;
      return pt(oPoint.x + Math.cos(mid) * (radius + 7), oPoint.y + Math.sin(mid) * (radius + 7));
    }

    function clear(node) {
      while (node.firstChild) node.removeChild(node.firstChild);
    }

    function line(parent, p, q, color, width) {
      const el = document.createElementNS(NS, 'line');
      el.setAttribute('x1', p.x);
      el.setAttribute('y1', p.y);
      el.setAttribute('x2', q.x);
      el.setAttribute('y2', q.y);
      el.setAttribute('stroke', color);
      el.setAttribute('stroke-width', width);
      el.setAttribute('stroke-linecap', 'round');
      parent.appendChild(el);
      return el;
    }

    function poly(parent, points, fill, stroke, width) {
      const el = document.createElementNS(NS, 'polygon');
      el.setAttribute('points', points.map(p => `${p.x},${p.y}`).join(' '));
      el.setAttribute('fill', fill);
      el.setAttribute('stroke', stroke);
      el.setAttribute('stroke-width', width);
      parent.appendChild(el);
      return el;
    }

    function point(parent, p, color, radius, symbol) {
      const el = document.createElementNS(NS, 'circle');
      el.setAttribute('cx', p.x);
      el.setAttribute('cy', p.y);
      el.setAttribute('r', radius);
      el.setAttribute('fill', color);
      if (symbol) {
        el.style.cursor = 'pointer';
        el.addEventListener('click', (event) => {
          event.stopPropagation();
          showSymbolInfo(symbol);
        });
      }
      parent.appendChild(el);
      return el;
    }

    function dragHandle(parent, p, radius, onDrag, symbol) {
      const el = document.createElementNS(NS, 'circle');
      el.setAttribute('cx', p.x);
      el.setAttribute('cy', p.y);
      el.setAttribute('r', radius);
      el.setAttribute('fill', 'transparent');
      el.style.cursor = 'grab';
      el.addEventListener('pointerdown', (event) => {
        event.preventDefault();
        if (symbol) showSymbolInfo(symbol);
        el.style.cursor = 'grabbing';
        const move = (moveEvent) => onDrag(moveEvent);
        const up = () => {
          el.style.cursor = 'grab';
          window.removeEventListener('pointermove', move);
          window.removeEventListener('pointerup', up);
        };
        window.addEventListener('pointermove', move);
        window.addEventListener('pointerup', up);
      });
      parent.appendChild(el);
      return el;
    }

    function circle(parent, center, radius, fill, stroke, width) {
      const el = document.createElementNS(NS, 'circle');
      el.setAttribute('cx', center.x);
      el.setAttribute('cy', center.y);
      el.setAttribute('r', radius);
      el.setAttribute('fill', fill);
      el.setAttribute('stroke', stroke);
      el.setAttribute('stroke-width', width);
      parent.appendChild(el);
      return el;
    }

    function rect(parent, x, y, width, height, fill, stroke, strokeWidth) {
      const el = document.createElementNS(NS, 'rect');
      el.setAttribute('x', x);
      el.setAttribute('y', y);
      el.setAttribute('width', width);
      el.setAttribute('height', height);
      el.setAttribute('fill', fill);
      el.setAttribute('stroke', stroke);
      el.setAttribute('stroke-width', strokeWidth);
      parent.appendChild(el);
      return el;
    }

    function path(parent, d, fill, stroke, width) {
      const el = document.createElementNS(NS, 'path');
      el.setAttribute('d', d);
      el.setAttribute('fill', fill);
      el.setAttribute('stroke', stroke);
      el.setAttribute('stroke-width', width);
      el.setAttribute('stroke-linecap', 'round');
      parent.appendChild(el);
      return el;
    }

    function normalizeSymbol(symbol) {
      return sharedSymbolKey(symbol);
    }

    function showSymbolInfo(symbol) {
      const box = document.getElementById('symbolInfo');
      if (!box || !SYMBOL_INFO[normalizeSymbol(symbol)]) return;
      box.innerHTML = symbolInfoHtml(symbol);
    }

    function text(parent, value, x, y, color, size, symbol) {
      const el = document.createElementNS(NS, 'text');
      el.textContent = value;
      el.setAttribute('x', x);
      el.setAttribute('y', y);
      el.setAttribute('fill', color);
      el.setAttribute('font-size', size);
      el.setAttribute('font-weight', '600');
      el.setAttribute('text-anchor', 'middle');
      if (symbol || SYMBOL_INFO[normalizeSymbol(value)]) {
        el.style.cursor = 'pointer';
        el.addEventListener('click', (event) => {
          event.stopPropagation();
          showSymbolInfo(symbol || value);
        });
      }
      parent.appendChild(el);
      return el;
    }

    function label(parent, value, p, color) {
      return text(parent, value, p.x, p.y - 7, color, 12, value);
    }
  }
</script>
</body>
</html>
