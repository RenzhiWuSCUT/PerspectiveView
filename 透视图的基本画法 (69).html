<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>透视图的基本画法</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #fff;
      color: #111;
      font-family: Arial, "Noto Sans SC", "Microsoft YaHei", sans-serif;
    }
    .page-title {
      position: fixed;
      left: 18px;
      top: 14px;
      z-index: 5;
      font-size: 22px;
      font-weight: 600;
      pointer-events: none;
    }
    .panel {
      position: fixed;
      right: 16px;
      top: 14px;
      z-index: 5;
      display: grid;
      gap: 8px;
      width: 168px;
    }
    .button-group { display: grid; gap: 0; }
    .button-group button + button { margin-top: -1px; }
    .button-group button { border-radius: 0; }
    .button-group button:first-child { border-radius: 6px 6px 0 0; }
    .button-group button:last-child { border-radius: 0 0 6px 6px; }
    .panel button {
      height: 32px;
      border: 1px solid #b8b8b8;
      background: rgba(255, 255, 255, 0.94);
      color: #111;
      font-size: 13px;
      cursor: pointer;
      font-family: Arial, "Noto Sans SC", "Microsoft YaHei", sans-serif;
    }
    .panel button.active {
      border-color: #0b57ff;
      color: #0b57ff;
      font-weight: 600;
    }
    .note {
      padding: 8px 10px;
      border: 1px solid #b8b8b8;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.94);
      font-size: 12px;
      line-height: 1.45;
    }
    .wrap {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    svg {
      display: block;
      width: 100vw;
      height: 100vh;
      user-select: none;
    }
    text {
      font-family: Arial, "Noto Sans SC", "Microsoft YaHei", sans-serif;
      font-size: 18px;
      fill: #000;
      dominant-baseline: middle;
      font-weight: 400;
    }
    .zh { font-size: 18px; font-weight: 600; }
    .angle-label { font-size: 14px; }
    .axis { stroke: #000; stroke-width: 2; fill: none; }
    .front-border { stroke: #f00; stroke-width: 2; fill: none; }
    .top-border { stroke: #24964a; stroke-width: 2; fill: none; }
    .side-border { stroke: #d6a600; stroke-width: 2; fill: none; }
    .object { stroke: #000; stroke-width: 3.2; fill: none; stroke-linejoin: round; stroke-linecap: round; }
    .thin { stroke: #000; stroke-width: 2; fill: none; }
    .blue { stroke: #001dff; stroke-width: 0.85; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .guide { stroke: #001dff; stroke-width: 0.85; fill: none; stroke-linecap: round; }
    line, path { marker-start: none !important; marker-mid: none !important; marker-end: none !important; }
    .dash { stroke-dasharray: none; }
    .blue.dash, .guide.dash, .blue.light-blue-line, .guide.light-blue-line { stroke: #72a8ff; stroke-width: 0.85; }
    .projection-line, .thin.projection-line, .blue.projection-line, .blue.dash.projection-line, .guide.projection-line, .guide.dash.projection-line { stroke: #a8d9a0; stroke-width: 0.85; }
    .guide.s-vanish-line { stroke: #9b6bd3; stroke-width: 0.85; }
    .guide.vanish-line, .guide.vanish-line.dash, .guide.vanish-line.light-blue-line { stroke: #f3a6c5; stroke-width: 0.85; }
    .dot-dash { stroke-dasharray: none; stroke-linecap: round; }
    .hidden-edge { stroke: #777; stroke-width: 2.4; fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: none; }
    .front-face { display: none; }
    .ground-fill { fill: #ead6bd; }
    .sky-fill { fill: #dff1ff; }
    .cloud { fill: #fff; stroke: none; opacity: 0.88; }
    .point { fill: #fff; stroke: #f00; stroke-width: 2; }
    .top-point { stroke: #24964a; }
    .front-point { stroke: #f00; }
    .side-point { stroke: #d6a600; }
    .drag { cursor: grab; }
    .drag:active { cursor: grabbing; }
    .step-el { transition: opacity 120ms ease; }
    .hidden { opacity: 0; pointer-events: none; }
    svg.labels-hidden text { opacity: 0; pointer-events: none; }
    svg.labels-hidden circle.point { opacity: 0; }
    svg.aux-hidden .aux { opacity: 0; pointer-events: none; }
    svg.examples-hidden .real-example { opacity: 0; pointer-events: none; }
    .real-example {
      pointer-events: none;
      transition: opacity 120ms ease;
    }
    .real-body {
      stroke: #333;
      stroke-width: 1.25;
      fill: #ffd4df;
      fill-opacity: 1;
      stroke-linejoin: round;
      stroke-linecap: round;
    }
    .real-limb {
      stroke: #333;
      stroke-width: 1.25;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .real-eye { fill: #111; stroke: none; }
  </style>
</head>

  <script>
    const svg = document.getElementById("svg");
    const $ = (id) => document.getElementById(id);
    const MAIN_X = 270;
    const INITIAL_H_Y = 495;
    const BOTTOM_OX_Y = 555;
    const MEASURE_BASE_Y = 555;
    const MEASURE_TOP_MIN = 302;
    const MEASURE_TOP_MAX = 520;
    const H_BOUNDS = { xMin: 84, xMax: 270, yMin: 35, yMax: 165 };
    const S_BOUNDS = { xMin: 70, xMax: 430, yMax: 475, oxGap: 8 };
    const AB_VEC = { x: 75, y: -75 };
    const AC_VEC = { x: -55, y: -55 };
    let horizonY = INITIAL_H_Y;
    let FX = { x: 60, y: horizonY };
    let FY = { x: 550, y: horizonY };
    const initial = {
      a: { x: 140, y: 165 },
      b: { x: 215, y: 90 },
      c: { x: 85, y: 110 },
      d: { x: 160, y: 35 }
    };
    const initialS = { x: 188, y: 385 };
    const notes = {
      1: "1）作透视图的布局。",
      2: "2）确定视平线、视点位置和视角。",
      3: "3）求出灭点：过 s 作 ac 的平行线交 OX 于 fₓ；过 s 作 ab 的平行线交 OX 于 fᵧ；再由 fₓ、fᵧ 竖投到 h，得到 Fₓ、Fᵧ。",
      4: "4）由 S-c、S-d 与 OX 确定 cₓ、dₓ；x 点在 a 右侧取 Fᵧ，在 a 左侧取 Fₓ。",
      5: "5）通过真高线求出高度；C⁰ = FₓA⁰ 与 cₓ 垂线交点，D⁰ = FₓB⁰ 与 dₓ 垂线交点。"
    };
    let rect = structuredClone(initial);
    let sPoint = structuredClone(initialS);
    let z1Height = 125;
    let currentStep = 5;
    let labelsVisible = true;
    let auxVisible = true;
    let examplesVisible = false;
    let dragging = null;
    let dragStart = null;
    let rectStart = null;
    let sStart = null;
    let horizonStart = null;
    let z1Start = null;
    const paintSlots = new WeakMap();

    function add(a, b) { return { x: a.x + b.x, y: a.y + b.y }; }
    function sub(a, b) { return { x: a.x - b.x, y: a.y - b.y }; }
    function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
    function rotate(v, angle) {
      const c = Math.cos(angle);
      const s = Math.sin(angle);
      return { x: v.x * c - v.y * s, y: v.x * s + v.y * c };
    }
    function normalizeAngle(angle) {
      while (angle > Math.PI) angle -= Math.PI * 2;
      while (angle < -Math.PI) angle += Math.PI * 2;
      return angle;
    }
    function rectFromA(a) {
      const b = add(a, AB_VEC);
      const c = add(a, AC_VEC);
      const d = add(b, AC_VEC);
      return { a, b, c, d };
    }
    function path(points) { return `M ${points.map((p) => `${p.x} ${p.y}`).join(" L ")} Z`; }
    function openPath(points) { return `M ${points.map((p) => `${p.x} ${p.y}`).join(" L ")}`; }
    function setLine(id, p, q) {
      const el = $(id);
      el.setAttribute("x1", p.x);
      el.setAttribute("y1", p.y);
      el.setAttribute("x2", q.x);
      el.setAttribute("y2", q.y);
    }
    function setCircle(id, p) {
      const el = $(id);
      el.setAttribute("cx", p.x);
      el.setAttribute("cy", p.y);
    }
    function setCircleSize(id, p, r) {
      const el = $(id);
      el.setAttribute("cx", p.x);
      el.setAttribute("cy", p.y);
      el.setAttribute("r", r);
    }
    function setEllipse(id, p, rx, ry, rotate = 0) {
      const el = $(id);
      el.setAttribute("cx", p.x);
      el.setAttribute("cy", p.y);
      el.setAttribute("rx", rx);
      el.setAttribute("ry", ry);
      el.setAttribute("transform", `rotate(${rotate} ${p.x} ${p.y})`);
    }
    function setText(id, p, text, dx = 0, dy = 0) {
      const el = $(id);
      el.setAttribute("x", p.x + dx);
      el.setAttribute("y", p.y + dy);
      el.textContent = text;
    }
    function setLabelAbove(id, p, text) {
      const el = $(id);
      el.setAttribute("x", p.x);
      el.setAttribute("y", p.y - 12);
      el.setAttribute("text-anchor", "middle");
      el.textContent = text;
    }
    function setTextPos(id, x, y) {
      const el = $(id);
      el.setAttribute("x", x);
      el.setAttribute("y", y);
    }
    function rememberPaintSlot(el) {
      if (paintSlots.has(el)) return;
      paintSlots.set(el, {
        parent: el.parentNode,
        next: el.nextSibling,
        step: el.closest("[data-step]")?.dataset.step || "",
        aux: Boolean(el.closest(".aux")),
        ownAux: el.classList.contains("aux")
      });
    }

      setOccludedLine("guideB0Fx", dBehindFace || segmentCoveredByAnyFace(b0, FX, frontFaces));
      setOccludedLine("guideFxATop", segmentCoveredByAnyFace(A0, FX, frontFaces));
      setOccludedLine("guideFxBTop", dBehindFace || segmentCoveredByAnyFace(B0, FX, frontFaces));
      setOccludedLine("guideAFy", segmentCoveredByAnyFace(a0, FY, frontFaces));
      setOccludedLine("guideBFy", segmentCoveredByAnyFace(b0, FY, frontFaces));
      setOccludedLine("guideC0Fy", cBehindFace || segmentCoveredByAnyFace(c0, FY, frontFaces));
      setOccludedLine("guideD0Fy", dBehindFace || segmentCoveredByAnyFace(d0, FY, frontFaces));
      setOccludedLine("guideATopFy", segmentCoveredByAnyFace(A0, FY, frontFaces));
      setOccludedLine("guideBtopFx", segmentCoveredByAnyFace(B0, FX, frontFaces));
      setLabelAbove("labelATop", A0, "A⁰");
      setLabelAbove("labelBTop", B0, "B⁰");
      setLabelAbove("labelCTop", C0, "C⁰");
      setLabelAbove("labelDTop", D0, "D⁰");
      syncAllLightBluePaintOrder();
      notes[2] = "2）确定视平线、视点位置和投射线：S-c、S-b、S-d 与 OX 分别交于 cₓ、bₓ、dₓ。";
      if (currentStep === 2) $("note").textContent = notes[2];
    }
    function setStep(step) {
      currentStep = step;
      document.querySelectorAll("[data-step]").forEach((el) => {
        el.classList.toggle("hidden", Number(el.dataset.step) > currentStep);
      });
      document.querySelectorAll("[data-step-button]").forEach((button) => {
        button.classList.toggle("active", Number(button.dataset.stepButton) === currentStep);
      });
      $("note").textContent = notes[currentStep];
    }
    document.querySelectorAll("[data-step-button]").forEach((button) => {
      button.addEventListener("click", () => setStep(Number(button.dataset.stepButton)));
    });
    $("labelToggleBtn").addEventListener("click", () => {
      labelsVisible = !labelsVisible;
      svg.classList.toggle("labels-hidden", !labelsVisible);
      $("labelToggleBtn").textContent = labelsVisible ? "隐藏标注" : "显示标注";
    });
    $("auxToggleBtn").addEventListener("click", () => {
      auxVisible = !auxVisible;
      svg.classList.toggle("aux-hidden", !auxVisible);
      $("auxToggleBtn").textContent = auxVisible ? "隐藏辅助线" : "显示辅助线";
    });
    $("exampleToggleBtn").addEventListener("click", () => {
      examplesVisible = !examplesVisible;
      svg.classList.toggle("examples-hidden", !examplesVisible);
      $("exampleToggleBtn").textContent = examplesVisible ? "隐藏实物示例" : "显示实物示例";
    });
    $("resetBtn").addEventListener("click", () => {
      rect = structuredClone(initial);
      sPoint = structuredClone(initialS);
      horizonY = INITIAL_H_Y;
      z1Height = 125;
      render();
    });
    $("ptA").addEventListener("pointerdown", (event) => {
      dragging = "a";
      dragStart = mainPointFromEvent(event);
      rectStart = structuredClone(rect);
      svg.setPointerCapture(event.pointerId);
      event.preventDefault();
    });
    $("ptD").addEventListener("pointerdown", (event) => {
      dragging = "d";
      dragStart = mainPointFromEvent(event);
      rectStart = structuredClone(rect);
      svg.setPointerCapture(event.pointerId);
      event.preventDefault();
    });
    $("ptS").addEventListener("pointerdown", (event) => {
      dragging = "s";
      dragStart = mainPointFromEvent(event);
      sStart = structuredClone(sPoint);
      svg.setPointerCapture(event.pointerId);
      event.preventDefault();
    });
    $("ptSPrime").addEventListener("pointerdown", (event) => {
      dragging = "sPrime";
      dragStart = mainPointFromEvent(event);
      sStart = structuredClone(sPoint);
      horizonStart = horizonY;
      svg.setPointerCapture(event.pointerId);
      event.preventDefault();
    });
    for (const id of ["measureRect", "measureHandle"]) {
      $(id).addEventListener("pointerdown", (event) => {
        dragging = "z1";
        dragStart = globalPointFromEvent(event);
        z1Start = z1Height;
        svg.setPointerCapture(event.pointerId);
        event.preventDefault();
      });
    }
    svg.addEventListener("pointermove", (event) => {
      if (!dragging) return;
      if (dragging === "a") {
        const p = mainPointFromEvent(event);
        rect = translateRect(rectStart, sub(p, dragStart));
        sPoint = clampSPoint(sPoint);
      }
      if (dragging === "d") {
        const p = mainPointFromEvent(event);
        rect = dragRectFromD(rectStart, add(rectStart.d, sub(p, dragStart)));
        sPoint = clampSPoint(sPoint);
      }
      if (dragging === "s") {
        const p = mainPointFromEvent(event);
        const candidate = add(sStart, sub(p, dragStart));
        sPoint = clampSPoint(candidate);
      }
      if (dragging === "sPrime") {
        const p = mainPointFromEvent(event);
        const candidate = {
          x: sStart.x + p.x - dragStart.x,
          y: horizonStart + p.y - dragStart.y
        };
        const clamped = clampSPrimeDrag(candidate);
        sPoint = clampSPoint({ x: clamped.x, y: sPoint.y });
        horizonY = clamped.y;
      }
      if (dragging === "z1") {
        const p = globalPointFromEvent(event);
        z1Height = clamp(z1Start + dragStart.y - p.y, MEASURE_BASE_Y - MEASURE_TOP_MAX, MEASURE_BASE_Y - MEASURE_TOP_MIN);
      }
      render();
    });
    svg.addEventListener("pointerup", () => { dragging = null; });
    svg.addEventListener("pointercancel", () => { dragging = null; });
    render();
    svg.classList.toggle("examples-hidden", !examplesVisible);
    setStep(5);
  </script>
</body>
</html>
